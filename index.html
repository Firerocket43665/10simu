function initControl(win) {
  const body = $("#cpMain", win), pathEl = $("#cpPath", win), viewSel = $("#cpView", win);
  const nav = ["home"];
  function go(k) {
    const pg = CP_PAGES[k];
    if (!pg) return;
    if (nav[nav.length - 1] !== k) nav.push(k);
    if (nav.length > 8) nav.splice(1, 1);
    body.innerHTML = pg.html();
    body.scrollTop = 0;
    pathEl.textContent = "控制面板" + (k === "home" ? "" : " › " + pg.title);
  }
  curCp = { go: go };
  $("#cpBack", win).addEventListener("click", function () {
    if (nav.length <= 1) { toast("已经在控制面板主页"); return; }
    nav.pop();
    go(nav[nav.length - 1] || "home");
  });
  $("#cpUp", win).addEventListener("click", function () { nav.length = 1; go("home"); });
  viewSel.addEventListener("change", function () { CP_VIEW = viewSel.value; if (nav[nav.length - 1] === "home") go("home"); });
  body.addEventListener("click", function (e) {
    const box = e.target.closest(".cp-icon,.cp-cat");
    if (box) { go(box.dataset.p); return; }
    const lk = e.target.closest("[data-l]");
    if (lk) {
      const m = lk.dataset.l;
      if (m === "sys") go("system");
      else if (m === "pers") go("pers");
      else if (m === "prog") go("prog");
      else if (m === "about") go("about");
      else if (m === "restore") restoreApps();
      else if (m === "stgsys") openSettingsPage("sys");
      else if (m === "stgpers") openSettingsPage("pers");
      else if (m === "stgapp") openSettingsPage("app");
      else if (m === "taskmgr") openApp("taskmgr");
      else if (m === "regedit") openApp("regedit");
      else if (m === "aboutsys") openApp("about");
      return;
    }
    const btn = e.target.closest("[data-cp]");
    if (btn) {
      const m = btn.dataset.cp;
      if (m === "stgsys") openSettingsPage("sys");
      else if (m === "stgpers") openSettingsPage("pers");
      else if (m === "stgapp") openSettingsPage("app");
      else if (m === "regedit") openApp("regedit");
      else if (m === "aboutsys") openApp("about");
      else if (m === "taskmgr") openApp("taskmgr");
      else if (m === "restore") restoreApps();
      else if (m === "rmwall") { saveCustomWall(""); toast("已移除自定义壁纸"); go("pers"); }
      return;
    }
    const sw = e.target.closest("[data-sw]");
    if (sw) {
      const on = !sw.classList.contains("on");
      sw.classList.toggle("on", on);
      if (sw.dataset.sw === "cp.night") {
        NIGHT = on;
        if (NIGHT) { WALL_BEFORE_NIGHT = $("#desktop").className; setWall("wall-dark"); }
        else setWall(WALL_BEFORE_NIGHT);
        document.body.style.filter = NIGHT ? "brightness(.88)" : "";
        const act = document.querySelector('.ac-tile[data-ac="night"]');
        if (act) act.classList.toggle("on", NIGHT);
      }
      if (sw.dataset.sw === "cp.blur") {
        document.querySelectorAll("#taskbar,#startMenu,#actionCenter,#calendar,#powerMenu").forEach(function (x) {
          x.style.backdropFilter = on ? "" : "none";
        });
      }
      return;
    }
    const wp = e.target.closest(".wp");
    if (wp) {
      $$(".wp", body).forEach(function (x) { x.classList.remove("on"); });
      wp.classList.add("on");
      saveCustomWall("");
      setWall(wp.dataset.cls);
      return;
    }
    const cs = e.target.closest(".cs");
    if (cs) {
      setAccent(cs.dataset.ac);
      $$(".cs", body).forEach(function (x) { x.classList.toggle("on", x === cs); });
      toast("主题色已应用：" + cs.dataset.ac);
      return;
    }
    const un = e.target.closest("[data-un]");
    if (un) uninstallApp(un.dataset.un);
  });
  viewSel.value = CP_VIEW;
  go("home");
  win.el._cleanup = function () { if (curCp === api) curCp = null; };
}

/* ================= 窗口管理 ================= */
const desktop = $("#desktop");
let zTop = 100, seq = 0, cascade = 0;
const WINS = new Map();
let activeId = null;

function openWindow(o) {
  const id = "w" + (++seq);
  const el = document.createElement("div");
  el.className = "win";
  el.id = id;
  const maxW = desktop.clientWidth, maxH = desktop.clientHeight;
  const w = Math.min(o.w || 800, maxW - 30), h = Math.min(o.h || 500, maxH - 30);
  let left = 40 + cascade * 26, top = 26 + cascade * 22;
  cascade = (cascade + 1) % 8;
  if (left + w > maxW - 10) left = Math.max(8, maxW - w - 15);
  if (top + h > maxH - 10) top = Math.max(8, maxH - h - 15);
  el.style.left = left + "px"; el.style.top = top + "px";
  el.style.width = w + "px"; el.style.height = h + "px";
  el.style.zIndex = ++zTop;
  el.innerHTML =
    '<div class="win-title"><div class="win-tl"><span class="wico">' + (o.icon || IC.file) + '</span>' +
    '<span class="win-title-text">' + esc(o.title || "窗口") + '</span></div>' +
    '<div class="win-btns"><button class="wb min" title="最小化"><svg viewBox="0 0 10 10"><rect x="0" y="4.4" width="10" height="1.2"/></svg></button>' +
    '<button class="wb max" title="最大化"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>' +
    '<button class="wb close" title="关闭"><svg viewBox="0 0 10 10"><path d="M0.7 0L5 4.3 9.3 0 10 0.7 5.7 5 10 9.3 9.3 10 5 5.7 0.7 10 0 9.3 4.3 5 0 0.7z"/></svg></button></div></div>' +
    '<div class="win-body">' + (o.html || "") + '</div><div class="rz"></div>';
  desktop.appendChild(el);
  const win = { id: id, el: el, key: o.key || null, title: o.title || "窗口", icon: o.icon || IC.file, max: false, min: false };
  el._id = id;
  WINS.set(id, win);
  if (o.init) { try { o.init(el); } catch (err) { console.log(err); } }

  const title = $(".win-title", el);
  title.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".wb")) return;
    focusWin(id);
    if (win.max) return;
    const r = el.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    el.classList.add("resizing");
    title.setPointerCapture(e.pointerId);
    function move(ev) {
      const dR = desktop.getBoundingClientRect();
      let nx = ev.clientX - dR.left - ox, ny = ev.clientY - dR.top - oy;
      nx = Math.max(-w + 90, Math.min(dR.width - 90, nx));
      ny = Math.max(0, Math.min(dR.height - 34, ny));
      el.style.left = nx + "px"; el.style.top = ny + "px";
    }
    function up() {
      el.classList.remove("resizing");
      title.removeEventListener("pointermove", move);
      title.removeEventListener("pointerup", up);
    }
    title.addEventListener("pointermove", move);
    title.addEventListener("pointerup", up);
  });
  title.addEventListener("dblclick", function (e) { if (!e.target.closest(".wb")) toggleMax(id); });
  title.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    showCtx(e.clientX, e.clientY, [
      { label: "还原", icon: IC.monitor, act: function () { toggleMax(id); } },
      { label: "最小化", icon: IC.monitor, act: function () { minimize(id); } },
      { label: "最大化", icon: IC.monitor, act: function () { maximize(id); } },
      { sep: true },
      { label: "关闭", icon: IC.trash, act: function () { closeWindow(id); } }
    ]);
  });
  $(".wb.min", el).addEventListener("click", function (e) { e.stopPropagation(); minimize(id); });
  $(".wb.max", el).addEventListener("click", function (e) { e.stopPropagation(); toggleMax(id); });
  $(".wb.close", el).addEventListener("click", function (e) { e.stopPropagation(); closeWindow(id); });

  const rz = $(".rz", el);
  rz.addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    focusWin(id);
    if (win.max) return;
    const sx = e.clientX, sy = e.clientY, sw = el.offsetWidth, sh = el.offsetHeight;
    rz.setPointerCapture(e.pointerId);
    function mv(ev) {
      el.style.width = Math.max(280, sw + ev.clientX - sx) + "px";
      el.style.height = Math.max(180, sh + ev.clientY - sy) + "px";
    }
    function up() { rz.removeEventListener("pointermove", mv); rz.removeEventListener("pointerup", up); }
    rz.addEventListener("pointermove", mv);
    rz.addEventListener("pointerup", up);
  });
  el.addEventListener("pointerdown", function () { focusWin(id); }, true);
  focusWin(id);
  renderTaskbar();
  return win;
}

let BEEP_CTX = null;
function beep(freq, dur) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!BEEP_CTX) BEEP_CTX = new AC();
    const c = BEEP_CTX;
    if (c.state === "suspended") c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine";
    o.frequency.value = freq || 880;
    const v = TR.muted ? 0 : (TR.vol / 100) * ((TR.spk1 + TR.spk2) / 200);
    const t0 = c.currentTime;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.16 * v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.16));
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + (dur || 0.16) + 0.03);
  } catch (e) {}
}

  if (TR.muted || TR.vol === 0) return IC.volMute;

function initBattery() {
  function onChange() {
    BAT_S.level = BAT.level; BAT_S.charging = BAT.charging;
    BAT_S.chargingTime = BAT.chargingTime; BAT_S.dischargingTime = BAT.dischargingTime;
    updateTrayIcons(); if (TR.fly === "bat") renderFly("bat");
  }
  function ready(b) {
    BAT = b;
    BAT_S.ok = true;
    onChange();
    ["levelchange", "chargingchange", "chargingtimechange", "dischargingtimechange"].forEach(function (ev) {
      try { BAT.addEventListener(ev, onChange); } catch (e) {}
    });
  }
  try {
    if (navigator.getBattery) navigator.getBattery().then(ready).catch(function () { updateTrayIcons(); });
    else if (navigator.battery) ready(navigator.battery);
    else updateTrayIcons();
  } catch (e) { updateTrayIcons(); }
}

const flyEl = $("#trayFly");
function sl(id, val, off) {
  return '<input type="range" class="vsl' + (off ? " off" : "") + '" data-v="' + id + '" min="0" max="100" value="' + val +
    '" style="--p:' + val + '%">';
}
function renderFly(type) {
  let h = "";
  if (type === "net") {
    h = '<div class="fly-hd">网络</div>';
    if (TR.wifi) {
      h += '<div class="fly-sec"><div class="fly-card on"><span class="fi">' + IC.wifi + '</span>' +
        '<div class="ft"><div class="t">' + TR.conn + '</div><div class="s">已连接</div></div>' +
        '<span class="fb" data-a="netprop">属性</span></div></div>';
    } else {
      h += '<div class="fly-sec"><div class="fly-card"><span class="fi">' + IC.wifiOff + '</span>' +
        '<div class="ft"><div class="t">飞行模式</div><div class="s">所有无线连接已关闭</div></div></div></div>';
    }
    h += '<div class="fly-sep"></div><div class="fly-lbl">可用的网络</div><div class="fly-sec">';
    NET_WORKS.forEach(function (n, i) {
      if (n.on) return;
      h += '<div class="fly-card" data-a="netjoin" data-i="' + i + '"><span class="fi">' + IC.wifi +
        '</span><div class="ft"><div class="t">' + n.n + '</div><div class="s">' +
        (n.sec ? "已加密 · 信号 " + n.s + "/4" : "开放网络 · 信号 " + n.s + "/4") + '</div></div>' +
        (n.sec ? '<span class="fi">' + IC.lockS + '</span>' : "") + "</div>";
    });
    h += "</div>";
    h += '<div class="fly-sep"></div>' +
      '<div class="fly-row"><span class="ri">' + IC.wifiOff + '</span><div class="rt"><div class="n"><span>飞行模式</span></div></div>' +
      '<div class="fly-sw' + (TR.wifi ? "" : " on") + '" data-a="flymode"><i></i></div></div>';
    h += '<div class="fly-foot"><span class="fl" data-a="netset">' + IC.settings + '网络设置</span></div>';
    h += '<div class="fly-hint">这里的网络列表是模拟的，不会真正连接任何 Wi-Fi。</div>';
  } else if (type === "vol") {
    h = '<div class="fly-hd">声音</div>';
    h += '<div class="fly-row"><span class="ri">' + volIcon() + '</span><div class="rt">' +
      '<div class="n"><span>主音量</span><b>' + (TR.muted ? "静音" : TR.vol + "%") + "</b></div>" + sl("vol", TR.muted ? 0 : TR.vol, TR.muted) +
      '</div><div class="fly-sw' + (TR.muted ? " on" : "") + '" data-a="mute"><i></i></div></div>';
    h += '<div class="fly-sep"></div><div class="fly-lbl">扬声器</div>';
    h += '<div class="fly-row"><span class="ri">' + IC.spk + '</span><div class="rt">' +
      '<div class="n"><span>扬声器 1（左声道）</span><b>' + TR.spk1 + "%</b></div>" + sl("spk1", TR.spk1) + "</div></div>";
    h += '<div class="fly-row"><span class="ri">' + IC.spk + '</span><div class="rt">' +
      '<div class="n"><span>扬声器 2（右声道）</span><b>' + TR.spk2 + "%</b></div>" + sl("spk2", TR.spk2) + "</div></div>";
    h += '<div class="fly-sep"></div>' +
      '<div class="fly-row"><span class="ri">' + IC.bolt + '</span><div class="rt"><div class="n"><span>系统声音</span></div></div>' +
      '<div class="fly-sw' + (TR.sysSound ? " on" : "") + '" data-a="syssnd"><i></i></div></div>';
    h += '<div class="fly-row"><span class="ri">' + IC.info + '</span><div class="rt"><div class="n"><span>试听提示音</span></div></div>' +
      '<span class="fb" data-a="test" style="color:#0a62a8;font-size:12.5px">播放</span></div>';
    h += '<div class="fly-foot"><span class="fl" data-a="soundset">' + IC.settings + '声音设置</span>' +
      '<span class="fl" data-a="mixer" style="margin-left:auto">' + IC.spk + '音量合成器</span></div>';
    h += '<div class="fly-hint">拖动滑块可实时调节；点「播放」会用浏览器合成一段测试音（音量随滑块变化）。</div>';
  } else if (type === "bat") {
    const p = batPct(), chg = BAT_S.ok && BAT_S.charging;
    h = '<div class="fly-hd">电源</div>';
    if (BAT_S.ok) {
      h += '<div class="fly-big">' + batSvg(p, chg) + '<div><div class="bp">' + p + '%</div>' +
        '<div style="font-size:12px;color:#777">' + (chg ? "正在充电" : "正在使用电池") + "</div></div></div>";
      h += '<div class="fly-bar"><i style="width:' + p + "%;background:" + batColor(p) + '"></i></div>';
      h += '<div class="fly-st">' + (chg ? IC.bolt : IC.info) + "<span>" +
        (chg ? (BAT_S.chargingTime && isFinite(BAT_S.chargingTime) ? "预计 " + Math.round(BAT_S.chargingTime / 60) + " 分钟充满" : "正在充电")
             : (BAT_S.dischargingTime && isFinite(BAT_S.dischargingTime) ? "预计还可使用 " + Math.round(BAT_S.dischargingTime / 60) + " 分钟" : "正在使用电池")) +
        "</span></div>";
    } else {
      h += '<div class="fly-big">' + batSvg(100, true) + '<div><div class="bp">—</div>' +
        '<div style="font-size:12px;color:#777">未检测到电池</div></div></div>';
      h += '<div class="fly-st">' + IC.plug + "<span>正在使用电源适配器</span></div>";
      h += '<div class="fly-hint">浏览器没有提供电池信息（可能是台式机，或浏览器不支持 / 禁用了 Battery Status API），因此按接通电源处理。</div>';
    }
    h += '<div class="fly-sep"></div><div class="fly-lbl">电源模式</div>';
    h += '<div class="fly-row" style="padding-top:2px"><div class="rt">' +
      '<div class="n"><span>' + BAT_MODES[TR.mode] + "</span></div>" + sl("mode", Math.round(TR.mode * 100 / 3)) + "</div></div>";
    h += '<div class="fly-mode"><span>最佳电池寿命</span><span>最佳性能</span></div>';
    h += '<div class="fly-foot"><span class="fl" data-a="batset">' + IC.settings + '电源和电池</span></div>';
  }
  flyEl.innerHTML = h;
}
function openFly(type) {
  if (TR.fly === type) { closeFly(); return; }
  TR.fly = type;
  $("#actionCenter").classList.remove("open");
  $("#calendar").classList.remove("open");
  renderFly(type);
  flyEl.classList.add("open");
}
function closeFly() { TR.fly = false; flyEl.classList.remove("open"); }

flyEl.addEventListener("input", function (e) {
  const r = e.target.closest("[data-v]");
  if (!r) return;
  const v = parseInt(r.value, 10);
  r.style.setProperty("--p", v + "%");
  if (r.dataset.v === "vol") {
    TR.vol = v; if (TR.muted && v > 0) TR.muted = false;
    $("#trayVol").innerHTML = volIcon();
    const lb = r.parentNode.querySelector(".n b"); if (lb) lb.textContent = TR.muted ? "静音" : v + "%";
    const sw = flyEl.querySelector('[data-a="mute"]'); if (sw) sw.classList.toggle("on", TR.muted);
    updateTrayIcons();
  } else if (r.dataset.v === "spk1") {
    TR.spk1 = v; const lb = r.parentNode.querySelector(".n b"); if (lb) lb.textContent = v + "%";
  } else if (r.dataset.v === "spk2") {
    TR.spk2 = v; const lb = r.parentNode.querySelector(".n b"); if (lb) lb.textContent = v + "%";
  } else if (r.dataset.v === "mode") {
    const m = Math.min(3, Math.round(v * 3 / 100));
    if (m !== TR.mode) { TR.mode = m; const lb = r.parentNode.querySelector(".n span"); if (lb) lb.textContent = BAT_MODES[m]; }
  }
});
flyEl.addEventListener("click", function (e) {
  const a = e.target.closest("[data-a]");
  if (!a) return;
  const k = a.dataset.a;
  if (k === "mute") {
    TR.muted = !TR.muted;
    a.classList.toggle("on", TR.muted);
    const r = flyEl.querySelector('[data-v="vol"]');
    if (r) {
      r.value = TR.muted ? 0 : TR.vol;
      r.style.setProperty("--p", (TR.muted ? 0 : TR.vol) + "%");
      r.classList.toggle("off", TR.muted);
      const lb = r.parentNode.querySelector(".n b"); if (lb) lb.textContent = TR.muted ? "静音" : TR.vol + "%";
    }
    const ri = flyEl.querySelector(".fly-row .ri"); if (ri) ri.innerHTML = volIcon();
    updateTrayIcons();
  } else if (k === "syssnd") {
    TR.sysSound = !TR.sysSound;
    a.classList.toggle("on", TR.sysSound);
    toast(TR.sysSound ? "系统声音已开启" : "系统声音已关闭");
  } else if (k === "test") {
    if (!TR.sysSound) { toast("系统声音已关闭，无法试听"); return; }
    beep(880, 0.14); setTimeout(function () { beep(1175, 0.18); }, 170);
    toast("已播放测试音");
  } else if (k === "soundset") { closeFly(); openSettingsPage("sys"); }
  else if (k === "mixer") { closeFly(); openWindow({ title: "音量合成器", icon: IC.spk, w: 560, h: 420, html: renderMixer() }); }
  else if (k === "flymode") {
    TR.wifi = !TR.wifi;
    a.classList.toggle("on", !TR.wifi);
    updateTrayIcons();
    renderFly("net");
    toast(TR.wifi ? "飞行模式已关闭" : "飞行模式已开启");
  } else if (k === "netjoin") {
    const n = NET_WORKS[parseInt(a.dataset.i)];
    TR.conn = n.n; TR.wifi = true;
    NET_WORKS.forEach(function (x) { x.on = false; });
    n.on = true;
    updateTrayIcons(); renderFly("net");
    toast("已连接到 " + n.n + "（模拟）");
  } else if (k === "netprop") {
    closeFly();
    openWindow({
      title: TR.conn + " 属性", icon: IC.wifi, w: 520, h: 400,
      html: '<div style="padding:18px;font-size:13px;line-height:2.1;color:#333">网络名称（SSID）：<b>' + TR.conn + '</b><br>' +
        "网络类型：虚拟以太网<br>状态：已连接<br>信号强度：优秀<br>安全性：WPA2-个人<br>" +
        "IPv4 地址：192.168.1.66<br>子网掩码：255.255.255.0<br>默认网关：192.168.1.1<br>DNS 服务器：223.5.5.5, 114.114.114.114<br>" +
        '<div style="margin-top:12px;font-size:12px;color:#999">以上信息为模拟数据，不会读取真实网络配置。</div></div>'
    });
  } else if (k === "netset") { closeFly(); openSettingsPage("net"); }
  else if (k === "batset") { closeFly(); openSettingsPage("sys"); }
});
$("#trayNet").addEventListener("click", function (e) { e.stopPropagation(); openFly("net"); });
$("#trayVol").addEventListener("click", function (e) { e.stopPropagation(); openFly("vol"); });
$("#trayBat").addEventListener("click", function (e) { e.stopPropagation(); openFly("bat"); });
$("#actionBtn").addEventListener("click", function () { closeFly(); });
$("#clockBtn").addEventListener("click", function () { closeFly(); });
document.addEventListener("pointerdown", function (e) {
  if (TR.fly && !flyEl.contains(e.target) && !e.target.closest("#trayNet,#trayVol,#trayBat")) closeFly();
});

function renderMixer() {
  const apps = [
    { n: "扬声器 1", i: IC.spk, v: TR.spk1 },
    { n: "扬声器 2", i: IC.spk, v: TR.spk2 },
    { n: "系统声音", i: IC.bolt, v: TR.sysSound ? 70 : 0 },
    { n: "酷狗音乐", i: IC.kugou, v: 68 },
    { n: "Microsoft Edge", i: IC.edge, v: 45 }
  ];
  let h = '<div style="padding:16px;font-size:13px;color:#333">';
  h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><span style="width:22px;display:inline-block">' +
    volIcon() + '</span><div style="flex:1"><div style="display:flex;justify-content:space-between"><span>设备（主音量）</span><b style="font-weight:400;color:#666">' +
    (TR.muted ? "静音" : TR.vol + "%") + "</b></div>" + sl("mvol", TR.muted ? 0 : TR.vol, TR.muted) + "</div></div>";
  h += '<div style="font-size:12px;color:#777;margin:4px 0 10px">应用</div>';
  apps.forEach(function (a, i) {
    h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span style="width:22px;display:inline-block">' +
      a.i + '</span><div style="flex:1"><div style="display:flex;justify-content:space-between"><span>' + a.n +
      '</span><b style="font-weight:400;color:#666">' + a.v + "%</b></div>" + sl("mx" + i, a.v) + "</div></div>";
  });
  h += '<div style="font-size:12px;color:#999;margin-top:10px">模拟器不产生真实音频，这里的滑块只做界面演示。</div></div>';
  return h;
}

/* ================= 右键菜单 ================= */
const ctx = $("#ctxMenu");
function showCtx(x, y, items) {
  let h = "";
  items.forEach(function (it, i) {
    if (it.sep) { h += '<div class="ctx-sep"></div>'; return; }
    h += '<div class="ctx-item' + (it.disabled ? " disabled" : "") + '" data-i="' + i + '">' +
      '<span class="ico">' + (it.icon || "") + "</span>" + it.label + "</div>";
  });
  ctx.innerHTML = h;
  ctx.classList.add("open");
  const r = ctx.getBoundingClientRect();
  ctx.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
  ctx.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";
  ctx._items = items;
}
ctx.addEventListener("click", function (e) {
  const it = e.target.closest("[data-i]");
  if (!it) return;
  const item = ctx._items[parseInt(it.dataset.i)];
  hideCtx();
  if (item && item.act) item.act();
});
function hideCtx() { ctx.classList.remove("open"); }
document.addEventListener("pointerdown", function (e) {
  if (!ctx.contains(e.target)) hideCtx();
  if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) toggleStart(false);
  if (!powerMenu.contains(e.target) && !$("#powerBtn").contains(e.target)) powerMenu.classList.remove("open");
  if (!calEl.contains(e.target) && !$("#clockBtn").contains(e.target)) calEl.classList.remove("open");
  if (!acEl.contains(e.target) && !$("#actionBtn").contains(e.target)) acEl.classList.remove("open");
});
desktop.addEventListener("contextmenu", function (e) {
  if (e.target.closest(".win") || e.target.closest("#desktopIcons")) return;
  e.preventDefault();
  showCtx(e.clientX, e.clientY, [
    { label: "查看", icon: IC.monitor, act: function () { showCtx(e.clientX, e.clientY, [{ label: "大图标", icon: IC.monitor }, { label: "中等图标", icon: IC.monitor }, { label: "小图标", icon: IC.monitor }]); } },
    { label: "排序方式", icon: IC.refresh, disabled: false, act: function () { showCtx(e.clientX, e.clientY, [{ label: "名称", icon: IC.refresh }, { label: "大小", icon: IC.refresh }, { label: "项目类型", icon: IC.refresh }]); } },
    { label: "刷新", icon: IC.refresh, act: function () { const el = $("#desktopIcons"); el.style.opacity = ".25"; setTimeout(function () { el.style.opacity = "1"; }, 260); } },
    { sep: true },
    { label: "新建文件夹", icon: IC.plus, act: function () { EXTRA_ICONS.push({ n: "新建文件夹 (" + (EXTRA_ICONS.length + 1) + ")", files: [] }); renderDesktopIcons(); } },
    { sep: true },
    { label: "显示设置", icon: IC.monitor, act: function () { openApp("settings"); } },
    { label: "个性化", icon: IC.settings, act: function () { openSettingsPage("pers"); } },
    { label: "控制面板", icon: IC.cpl, act: function () { openApp("control"); } }
  ]);
});

/* ================= 任务栏右键菜单（移动端长按） ================= */
const taskbarEl = $("#taskbar");
function taskbarCtx(x, y) {
  showCtx(x, y, [
    { label: "任务管理器", icon: IC.taskmgr, act: function () { openApp("taskmgr"); } },
    { label: "显示桌面", icon: IC.monitor, act: function () { toggleShowDesktop(); } },
    { sep: true },
    { label: "任务栏设置", icon: IC.settings, disabled: true }
  ]);
}
taskbarEl.addEventListener("contextmenu", function (e) {
  e.preventDefault();
  e.stopPropagation();
  taskbarCtx(e.clientX, e.clientY);
});
let lpTimer = null, lpStart = null, lpFired = false, suppressClick = false;
taskbarEl.addEventListener("pointerdown", function (e) {
  if (e.pointerType === "mouse" && e.button === 2) return;
  lpStart = { x: e.clientX, y: e.clientY };
  lpFired = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(function () {
    if (!lpStart) return;
    lpFired = true;
    taskbarCtx(lpStart.x, lpStart.y);
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 400);
  }, 500);
});
taskbarEl.addEventListener("pointermove", function (e) {
  if (!lpStart) return;
  if (Math.abs(e.clientX - lpStart.x) > 12 || Math.abs(e.clientY - lpStart.y) > 12) {
    clearTimeout(lpTimer); lpStart = null;
  }
});
["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
  taskbarEl.addEventListener(ev, function () { clearTimeout(lpTimer); });
});
document.addEventListener("click", function (e) {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
}, true);

/* ================= 关机 ================= */
const ov = $("#overlay");
function power(msg) {
  ov.classList.add("on");
  $("#ovSpin").style.display = "";
  $("#ovMsg").textContent = msg;
  $("#ovRe").style.display = "none";
  setTimeout(function () {
    WINS.forEach(function (w) { w.el.classList.add("minimized"); w.min = true; });
    $("#ovSpin").style.display = "none";
    $("#ovMsg").textContent = "已关闭";
    $("#ovRe").style.display = "";
    renderTaskbar();
  }, 2000);
}
$("#ovRe").addEventListener("click", function () {
  ov.classList.remove("on");
  Array.from(WINS.keys()).forEach(function (id) { closeWindow(id); });
  toggleStart(false);
});

initBattery();

renderAC();

  WINS.forEach(function (w) { if (w.max) { w.el.style.width = "100%"; w.el.style.height = "100%"; } });
});
if (BOOT_LOCK) {
  showLock();
} else {
  unlockedOnce = true;
  setTimeout(function () { openApp("mypc"); }, 400);
