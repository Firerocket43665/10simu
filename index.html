<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 10 模拟器</title>
<style>
:root{
  --accent:#0078d7;
  --accent-dark:#005a9e;
  --taskbar:rgba(24,24,24,.86);
  --win-bg:#ffffff;
  --title-h:32px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:"Segoe UI","Microsoft YaHei","微软雅黑",-apple-system,"PingFang SC",sans-serif;
  font-size:14px;color:#1a1a1a;user-select:none;
}
#screen{position:fixed;inset:0;overflow:hidden}

/* ---------- 桌面 ---------- */
#desktop{
  position:absolute;inset:0 0 48px 0;
  background:
    radial-gradient(1200px 700px at 72% 38%, #2a9bf6 0%, rgba(42,155,246,0) 60%),
    radial-gradient(900px 900px at 20% 90%, #0b4f9c 0%, rgba(11,79,156,0) 55%),
    linear-gradient(150deg,#0a4f96 0%,#0d68c4 45%,#062f5e 100%);
  transition:background .6s ease;
  overflow:hidden;
}
#desktop.wall-dark{
  background:
    radial-gradient(1100px 700px at 70% 30%, #2b2f55 0%, rgba(43,47,85,0) 60%),
    linear-gradient(150deg,#14161f 0%,#1e2333 60%,#0b0d13 100%);
}
#desktop.wall-green{
  background:
    radial-gradient(1100px 700px at 70% 35%, #2fb98a 0%, rgba(47,185,138,0) 60%),
    linear-gradient(150deg,#0e5b46 0%,#12876a 55%,#06352a 100%);
}
#desktop.wall-violet{
  background:
    radial-gradient(1100px 700px at 65% 30%, #a05cf0 0%, rgba(160,92,240,0) 60%),
    linear-gradient(150deg,#4a1d7a 0%,#7b3fc4 55%,#2a0f47 100%);
}
#desktop.wall-sunset{
  background:
    radial-gradient(900px 600px at 30% 70%, #ff8a5c 0%, rgba(255,138,92,0) 55%),
    radial-gradient(900px 900px at 80% 25%, #ffd36e 0%, rgba(255,211,110,0) 45%),
    linear-gradient(160deg,#7a2340 0%,#c04a3f 55%,#2b1030 100%);
}
.win-watermark{
  position:absolute;right:6%;top:50%;transform:translateY(-50%);
  opacity:.14;pointer-events:none;width:420px;
}
.win-watermark svg{width:100%;height:auto;filter:drop-shadow(0 0 30px rgba(255,255,255,.25))}
#desktopIcons{
  position:absolute;left:0;top:0;padding:8px;width:110px;
  display:flex;flex-direction:column;gap:2px;z-index:1;
}
.dicon{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px 6px;border-radius:3px;border:1px solid transparent;cursor:default;
}
.dicon .ico{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.dicon .ico svg{width:100%;height:100%;display:block}
.dicon span{
  color:#fff;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.6);
  text-align:center;line-height:1.3;
}
.dicon:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
.dicon.selected{background:rgba(0,120,215,.55);border-color:rgba(160,210,255,.6)}
.dicon.selected span{background:rgba(0,120,215,.9)}

/* ---------- 窗口 ---------- */
.win{
  position:absolute;background:var(--win-bg);border:1px solid #b3b3b3;
  box-shadow:0 8px 32px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.15);
  display:flex;flex-direction:column;overflow:hidden;
  animation:winIn .16s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .13s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.97)}}
.win.minimized{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win-title{
  height:var(--title-h);flex:0 0 var(--title-h);background:#f5f5f5;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #e0e0e0;cursor:default;
}
.win:not(.active) .win-title{background:#fafafa}
.win:not(.active){box-shadow:0 4px 18px rgba(0,0,0,.3);border-color:#c9c9c9}
.win:not(.active) .win-title-text{color:#8a8a8a}
.win-tl{display:flex;align-items:center;gap:8px;padding-left:10px;overflow:hidden}
.win-tl .wico{width:17px;height:17px;flex:0 0 17px}
.win-tl .wico svg{width:100%;height:100%;display:block}
.win-title-text{font-size:12.5px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-btns{display:flex;height:100%}
.wb{
  width:45px;height:100%;border:0;background:transparent;font-size:11px;color:#333;
  display:flex;align-items:center;justify-content:center;cursor:default;font-family:inherit;
}
.wb:hover{background:#e5e5e5}
.wb.close:hover{background:#e81123;color:#fff}
.wb svg{width:10px;height:10px;fill:currentColor}
.win-body{flex:1;overflow:auto;background:#fff}
.win.resizing{transition:none}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.rz::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;
  border-right:2px solid #999;border-bottom:2px solid #999}

/* ---------- 任务栏 ---------- */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--taskbar);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;align-items:center;z-index:9000;color:#fff;border-top:1px solid rgba(255,255,255,.06);
}
#startBtn{
  width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  cursor:default;flex:0 0 48px;
}
#startBtn:hover{background:rgba(255,255,255,.12)}
#startBtn.on{background:rgba(255,255,255,.18)}
#startBtn svg{width:22px;height:22px}
#searchBox{
  width:210px;height:34px;margin-right:8px;border-radius:2px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:8px;padding:0 10px;
  color:#d8d8d8;font-size:13px;cursor:default;flex:0 0 auto;
}
#searchBox:hover{background:rgba(255,255,255,.16)}
#searchBox svg{width:15px;height:15px;fill:#d8d8d8}
#tasks{flex:1;display:flex;align-items:center;gap:2px;overflow:hidden;padding:0 4px}
.tbtn{
  min-width:44px;max-width:170px;height:40px;flex:0 1 auto;display:flex;align-items:center;gap:8px;
  padding:0 10px;border-radius:2px;position:relative;cursor:default;color:#eaeaea;font-size:13px;
  background:rgba(255,255,255,.06);
}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn.active{background:rgba(255,255,255,.2);box-shadow:inset 0 -2px 0 var(--accent)}
.tbtn .ico{width:20px;height:20px;flex:0 0 20px}
.tbtn .ico svg{width:100%;height:100%;display:block}
.tbtn .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tray{display:flex;align-items:center;height:48px;flex:0 0 auto}
.tray-ico{width:30px;height:48px;display:flex;align-items:center;justify-content:center;color:#eaeaea}
.tray-ico:hover{background:rgba(255,255,255,.12)}
.tray-ico svg{width:16px;height:16px;fill:#eaeaea}
#clockBtn{
  height:48px;padding:0 10px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  font-size:12px;line-height:1.35;cursor:default;color:#fff;min-width:92px;
}
#clockBtn:hover{background:rgba(255,255,255,.12)}
#showDesktop{
  width:8px;height:48px;border-left:1px solid rgba(255,255,255,.18);
  margin-left:4px;cursor:default;
}
#showDesktop:hover{background:rgba(255,255,255,.22)}
.battery{width:22px;height:12px;border:1.5px solid #eaeaea;border-radius:2px;position:relative;padding:1px}
.battery::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:6px;background:#eaeaea;border-radius:0 1px 1px 0}
.battery i{display:block;height:100%;width:78%;background:#eaeaea}

/* ---------- 开始菜单 ---------- */
#startMenu{
  position:absolute;left:0;bottom:48px;width:min(640px,100vw);height:min(620px,calc(100vh - 52px));z-index:9500;
  background:rgba(30,30,30,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(24px);opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.2,.9,.3,1),opacity .18s ease;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}
#startMenu.open{transform:none;opacity:1;pointer-events:auto}
.sm-top{padding:16px 20px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0078d7,#00c0a0);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.sm-top .nm{font-size:15px}
.sm-top .sub{font-size:12px;color:#bbb}
.sm-body{flex:1;display:flex;overflow:hidden}
.sm-left{width:230px;flex:0 0 230px;overflow:auto;padding:8px 0;border-right:1px solid rgba(255,255,255,.07)}
.sm-item{display:flex;align-items:center;gap:12px;padding:9px 18px;font-size:13.5px;cursor:default;color:#eaeaea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-item:hover{background:rgba(255,255,255,.12)}
.sm-grp{font-size:11.5px;color:#9aa0a6;padding:12px 18px 5px;letter-spacing:.5px}
.sm-item .ico{width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center}
.sm-item .ico svg{width:100%;height:100%}
.sm-right{flex:1;padding:14px 18px;overflow:auto}
.sm-sec{font-size:12.5px;color:#cfcfcf;margin:6px 0 10px;display:flex;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;grid-auto-flow:row dense;align-content:start}
.tile{
  aspect-ratio:1/1;border-radius:3px;padding:6px;display:flex;flex-direction:column;
  justify-content:flex-end;font-size:11.5px;cursor:default;position:relative;overflow:hidden;
  background:#2b2b2b;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .12s;
}
.tile:hover{transform:scale(1.04);outline:2px solid rgba(255,255,255,.35)}
.tile .ico{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:26px;height:26px}
.tile .ico svg{width:100%;height:100%;fill:#fff}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.big .ico{width:40px;height:40px}
.tile.big{font-size:13px}
.tile.wide{grid-column:span 2}
.tile.wide .ico{width:28px;height:28px}
.tile span{position:relative;z-index:2;line-height:1.25}
.sm-foot{
  height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;
}
.sm-foot .pw{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:2px;cursor:default}
.sm-foot .pw:hover{background:rgba(255,255,255,.12)}
.sm-foot .pw svg{width:16px;height:16px;fill:#eaeaea}

/* ---------- 电源菜单 ---------- */
#powerMenu{
  position:absolute;left:0;bottom:48px;width:220px;background:rgba(45,45,45,.97);z-index:9600;
  backdrop-filter:blur(20px);color:#fff;padding:6px;display:none;box-shadow:0 -6px 24px rgba(0,0,0,.5);
}
#powerMenu.open{display:block}
#powerMenu div{padding:11px 16px;font-size:13.5px;cursor:default;border-radius:2px}
#powerMenu div:hover{background:rgba(255,255,255,.14)}

/* ---------- 操作中心 ---------- */
#actionCenter{
  position:absolute;right:0;top:0;bottom:48px;width:360px;z-index:9400;
  background:rgba(28,28,28,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  color:#fff;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.9,.3,1);
  padding:16px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.4);
}
#actionCenter.open{transform:none}
.ac-title{font-size:13px;color:#ccc;margin:6px 0 10px}
.ac-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.ac-tile{
  aspect-ratio:1/.8;border-radius:3px;background:#3a3a3a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:11.5px;gap:4px;cursor:default;
}
.ac-tile:hover{background:#4a4a4a}
.ac-tile.on{background:var(--accent)}
.ac-tile svg{width:16px;height:16px;fill:#fff}
.notice{background:rgba(255,255,255,.07);border-radius:4px;padding:12px;margin-bottom:10px;font-size:13px}
.notice .nt{font-weight:600;margin-bottom:4px;font-size:13px}
.notice .nb{color:#cfcfcf;line-height:1.5}

/* ---------- 日历 ---------- */
#calendar{
  position:absolute;right:4px;bottom:52px;width:340px;background:rgba(30,30,30,.96);z-index:9600;
  backdrop-filter:blur(20px);color:#fff;padding:16px;display:none;box-shadow:0 6px 30px rgba(0,0,0,.5);
}
#calendar.open{display:block;animation:winIn .18s ease}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.cal-head button{background:transparent;border:0;color:#ddd;font-size:14px;cursor:default;padding:2px 8px;border-radius:2px}
.cal-head button:hover{background:rgba(255,255,255,.15)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-grid div{padding:6px 0;border-radius:2px}
.cal-grid .wd{color:#aaa}
.cal-grid .d:hover{background:rgba(255,255,255,.14);cursor:default}
.cal-grid .d.today{background:var(--accent);font-weight:600}
.cal-grid .d.other{color:#666}
.bigclock{font-size:38px;font-weight:200;text-align:center;margin:4px 0 12px}

/* ---------- 右键菜单 ---------- */
#ctxMenu{
  position:absolute;z-index:9800;min-width:190px;background:#f2f2f2;color:#1a1a1a;
  box-shadow:0 6px 22px rgba(0,0,0,.35);padding:4px 0;display:none;font-size:13px;
  border:1px solid #d0d0d0;
}
#ctxMenu.open{display:block;animation:winIn .12s ease}
.ctx-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:default;white-space:nowrap}
.ctx-item:hover{background:#dbe9f7}
.ctx-item .ico{width:16px;height:16px;flex:0 0 16px;opacity:.75}
.ctx-item .ico svg{width:100%;height:100%}
.ctx-item.disabled{color:#9a9a9a}
.ctx-item.disabled:hover{background:transparent}
.ctx-sep{height:1px;background:#dcdcdc;margin:4px 0}

/* ---------- 应用内容通用 ---------- */
.pane{height:100%;display:flex;flex-direction:column;background:#fff}
.ribbon{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #e6e6e6;background:#fafafa}
.rbtn{border:0;background:transparent;font:inherit;font-size:13px;padding:5px 10px;border-radius:2px;cursor:default;color:#333}
.rbtn:hover{background:#e8e8e8}
.addr{
  flex:1;height:28px;border:1px solid #d5d5d5;border-radius:2px;display:flex;align-items:center;
  padding:0 10px;font-size:13px;color:#333;background:#fff;
}
.addr .k{color:#0078d7;margin-right:4px}
.explorer{display:flex;flex:1;overflow:hidden}
.ex-side{width:170px;flex:0 0 170px;border-right:1px solid #ebebeb;padding:10px 0;overflow:auto;background:#fbfbfb}
.ex-side .grp{font-size:12px;color:#777;padding:8px 14px 4px}
.ex-side .it{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:13px;color:#222}
.ex-side .it:hover{background:#eef3f9}
.ex-side .it.on{background:#cfe4f7}
.ex-side .it svg{width:16px;height:16px;fill:#4a4a4a}
.ex-main{flex:1;overflow:auto;padding:14px}
.ex-main h4{margin:4px 0 12px;font-size:13px;color:#444;font-weight:600}
.drive{display:inline-block;width:230px;margin:0 14px 18px 0;padding:12px;border:1px solid #e8e8e8;border-radius:3px}
.drive:hover{background:#f6f9fc;border-color:#c8dcf0}
.drive .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.drive .hd .nm{font-size:13px;font-weight:600}
.drive .hd .lb{font-size:11.5px;color:#888}
.bar{height:12px;background:#ececec;border-radius:2px;overflow:hidden;border:1px solid #e0e0e0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0078d7,#29a3f0)}
.drive .cap{font-size:11.5px;color:#777;margin-top:6px}
.files{width:100%;border-collapse:collapse;font-size:13px}
.files th{text-align:left;font-weight:400;color:#666;padding:8px 10px;border-bottom:1px solid #e5e5e5;font-size:12px}
.files td{padding:7px 10px;border-bottom:1px solid #f2f2f2}
.files tr:hover td{background:#f4f8fc}

/* 记事本 */
#np{flex:1;width:100%;border:0;outline:0;resize:none;padding:12px;font-family:Consolas,"Courier New","Microsoft YaHei",monospace;font-size:14px;line-height:1.65;color:#222;user-select:text}
.np-status{display:flex;justify-content:space-between;padding:5px 12px;border-top:1px solid #eee;font-size:12px;color:#666;background:#fafafa}

/* Edge */
.edge-tabs{display:flex;align-items:center;gap:4px;background:#e9e9e9;padding:6px 8px 0}
.etab{padding:7px 14px;border-radius:6px 6px 0 0;font-size:12.5px;background:#dcdcdc;color:#555;max-width:200px;overflow:hidden;white-space:nowrap}
.etab.on{background:#fff;color:#222}
.edge-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border-bottom:1px solid #e3e3e3}
.ebtn{width:28px;height:28px;border:0;background:transparent;border-radius:50%;cursor:default;color:#444;font-size:14px}
.ebtn:hover{background:#eee}
.edge-page{padding:26px;color:#222}
.edge-page h1{font-size:26px;margin:0 0 6px}
.edge-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.ecard{border:1px solid #e6e6e6;border-radius:6px;padding:14px;background:#fbfcfd}
.ecard .t{font-weight:600;margin-bottom:5px;font-size:13.5px}
.ecard .d{font-size:12px;color:#777;line-height:1.5}

/* 酷狗 */
.kg{display:flex;height:100%;background:linear-gradient(180deg,#f7f9fb,#eef2f6)}
.kg-side{width:200px;flex:0 0 200px;background:#f4f7fa;border-right:1px solid #e4e9ee;padding:14px}
.kg-side .grp{font-size:12px;color:#8a94a0;margin:12px 0 6px}
.kg-side .it{padding:7px 10px;border-radius:3px;font-size:13px;color:#33455a}
.kg-side .it:hover{background:#e6edf4}
.kg-side .it.on{background:#dbe8f5;color:#0b62c4;font-weight:600}
.kg-main{flex:1;display:flex;flex-direction:column;padding:20px;overflow:auto}
.kg-cover{width:170px;height:170px;border-radius:8px;background:linear-gradient(135deg,#1e9be0,#2fd0b0);
  display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;
  box-shadow:0 8px 24px rgba(30,155,224,.35);align-self:center;margin:6px 0 18px}
.kg-cover.spin{animation:spin 9s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.kg-title{text-align:center;font-size:17px;font-weight:600;color:#223}
.kg-artist{text-align:center;font-size:13px;color:#7c8896;margin:5px 0 16px}
.kg-prog{display:flex;align-items:center;gap:10px;font-size:12px;color:#8492a0}
.pbar{flex:1;height:4px;background:#dde4ea;border-radius:2px;cursor:default;position:relative}
.pbar i{display:block;height:100%;width:0;background:#1e9be0;border-radius:2px}
.kg-ctrl{display:flex;align-items:center;justify-content:center;gap:22px;margin:20px 0}
.kbtn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#3b4a5c;font-size:15px;cursor:default;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.kbtn:hover{background:#f0f5fa}
.kbtn.play{width:52px;height:52px;background:#1e9be0;color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(30,155,224,.4)}
.plist{margin-top:8px}
.prow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:3px;font-size:13px;color:#33455a}
.prow:hover{background:#eef3f8}
.prow.on{background:#e3eefa;color:#0b62c4}
.prow .idx{width:22px;color:#9aa7b4;font-size:12px}
.prow .du{margin-left:auto;color:#9aa7b4;font-size:12px}

/* 设置 */
.stg{display:flex;height:100%}
.stg-side{width:200px;flex:0 0 200px;background:#f6f6f6;border-right:1px solid #ebebeb;padding:14px 0;overflow:auto}
.stg-side .it{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;color:#333}
.stg-side .it:hover{background:#ebebeb}
.stg-side .it.on{background:#e3eef8;box-shadow:inset 3px 0 0 var(--accent)}
.stg-side .it svg{width:17px;height:17px;fill:#4a90d9}
.stg-main{flex:1;padding:24px 28px;overflow:auto}
.stg-main h2{margin:0 0 4px;font-size:22px;font-weight:400}
.stg-main .desc{color:#777;font-size:13px;margin-bottom:20px}
.card{border:1px solid #e8e8e8;border-radius:4px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.card .txt{flex:1}
.card .txt .t{font-size:13.5px}
.card .txt .s{font-size:12px;color:#888}
.sw{width:44px;height:22px;border-radius:11px;background:#ccc;position:relative;cursor:default;transition:background .15s;flex:0 0 44px}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{left:25px}
.wallpicks{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.wp{width:96px;height:60px;border-radius:3px;cursor:default;border:2px solid transparent}
.wp.on{border-color:var(--accent)}
.wp span{display:block;width:100%;height:100%;border-radius:2px}

/* CMD */
.cmd{height:100%;background:#0c0c0c;color:#ccc;font-family:Consolas,"Courier New",monospace;font-size:13.5px;padding:12px;overflow:auto;line-height:1.55}
.cmd .line{white-space:pre-wrap;word-break:break-all}
.cmd .p{color:#0f0}
.cmd .inp{flex:1;user-select:text;background:transparent;border:0;outline:0;color:#ccc;font:inherit;caret-color:#ccc;min-width:60px}
.cmdrow{display:flex;align-items:center;gap:6px}

/* 计算器 */
.calc{height:100%;display:flex;flex-direction:column;background:#f2f2f2}
.calc-disp{flex:0 0 auto;padding:18px 16px;text-align:right;font-size:34px;font-weight:300;color:#111;background:#f2f2f2;word-break:break-all}
.calc-disp .expr{font-size:13px;color:#888;height:18px}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#d6d6d6;padding:2px}
.calc-keys button{border:0;background:#fbfbfb;font-size:17px;color:#111;cursor:default;font-family:inherit}
.calc-keys button:hover{background:#e6e6e6}
.calc-keys button.fn{background:#f5f5f5;color:#333}
.calc-keys button.eq{background:var(--accent);color:#fff}
.calc-keys button.eq:hover{background:var(--accent-dark)}

/* 照片 */
.photos{padding:18px;overflow:auto;height:100%;background:#fafafa}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{aspect-ratio:4/3;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);position:relative;overflow:hidden}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;color:#fff;font-size:12px;background:rgba(0,0,0,.35)}

/* 关机 / 锁屏 */
#overlay{
  position:absolute;inset:0;z-index:9999;background:#000;color:#fff;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#overlay.on{display:flex}
#overlay .spin{
  width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
  animation:spin 1s linear infinite;
}
#overlay .msg{font-size:15px;color:#ddd}
#overlay .re{font-size:13px;color:#9cf;padding:8px 16px;border:1px solid rgba(255,255,255,.3);border-radius:3px;cursor:default}
#overlay .re:hover{background:rgba(255,255,255,.15)}

/* 任务管理器 */
.tm{display:flex;flex-direction:column;height:100%;background:#f2f2f2}
.tm-tabs{display:flex;gap:2px;padding:8px 10px 0;background:#e8e8e8;border-bottom:1px solid #d5d5d5}
.tm-tab{padding:8px 16px;font-size:13px;color:#444;border-radius:4px 4px 0 0;cursor:default}
.tm-tab:hover{background:#dcdcdc}
.tm-tab.on{background:#fff;color:#111;box-shadow:inset 0 -2px 0 var(--accent)}
.tm-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid #e2e2e2}
.tm-bar .rbtn{border:1px solid #d5d5d5;background:#fafafa}
.tm-bar .sp{margin-left:auto;font-size:12.5px;color:#666}
.tm-body{flex:1;overflow:auto;background:#fff}
.tm-table{width:100%;border-collapse:collapse;font-size:12.5px}
.tm-table th{text-align:left;font-weight:400;color:#555;padding:9px 10px;border-bottom:1px solid #e0e0e0;font-size:12px;background:#fafafa;position:sticky;top:0}
.tm-table th.n{text-align:right}
.tm-table td{padding:7px 10px;border-bottom:1px solid #f4f4f4;color:#222}
.tm-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.tm-table tr:hover td{background:#f2f7fc}
.tm-table tr.sel td{background:#cfe4f7}
.tm-table .pn{display:flex;align-items:center;gap:8px}
.tm-table .pn svg{width:16px;height:16px}
.perf{padding:14px;display:flex;flex-direction:column;gap:12px}
.pcard{border:1px solid #e3e3e3;border-radius:4px;padding:12px 14px;display:flex;gap:14px;align-items:stretch;background:#fdfdfd}
.pcard .meta{width:190px;flex:0 0 190px}
.pcard .meta .nm{font-size:14px;font-weight:600;color:#222;line-height:1.4}
.pcard .meta .v{font-size:24px;font-weight:300;color:#111;margin:6px 0 2px}
.pcard .meta .sub{font-size:11.5px;color:#777;line-height:1.7}
.pcard canvas{flex:1;height:80px;width:100%;display:block}
.pcard .right{width:150px;flex:0 0 150px;font-size:11.5px;color:#666;line-height:1.9}
.pcard .right b{color:#333;font-weight:600}

/* 关于这个系统 */
.about{height:100%;overflow:auto;background:#fff}
.ab-hero{background:linear-gradient(135deg,#0f7fc0,#2ec5a8);color:#fff;padding:26px 28px;display:flex;align-items:center;gap:20px}
.ab-hero .lg{width:64px;height:64px;flex:0 0 64px;opacity:.95}
.ab-hero .lg svg{width:100%;height:100%}
.ab-hero h1{margin:0;font-size:21px;font-weight:400}
.ab-hero .sb{font-size:12.5px;opacity:.9;margin-top:4px}
.ab-sec{padding:16px 28px 6px}
.ab-sec h3{margin:0 0 8px;font-size:14px;font-weight:600;color:#222}
.ab-sec p{margin:0 0 8px;font-size:13px;line-height:1.85;color:#444}
.ab-sec ul{margin:0 0 8px;padding-left:20px;font-size:13px;line-height:1.9;color:#444}
.ab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:12.5px;color:#333}
.ab-grid div{display:flex;justify-content:space-between;border-bottom:1px dotted #e3e3e3;padding:6px 0}
.ab-grid span:first-child{color:#777}
.ab-note{background:#f6f8fa;border-left:3px solid var(--accent);padding:12px 14px;font-size:12.5px;line-height:1.8;color:#444;margin:4px 0 10px}
.ab-foot{padding:10px 28px 26px;font-size:12px;color:#999;text-align:center}

/* 天气 */
.wx{padding:18px;height:100%;overflow:auto;background:linear-gradient(180deg,#eaf4fd,#f7fbff)}
.wx-now{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.wx-now .t{font-size:44px;font-weight:200;color:#123}
.wx-now .c{font-size:14px;color:#345}
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wx-d{border:1px solid #e4eef7;border-radius:6px;padding:12px;text-align:center;background:#fff}
.wx-d .d{font-size:12px;color:#789}
.wx-d .i{font-size:24px;margin:6px 0}
.wx-d .r{font-size:12.5px;color:#345}

/* 资讯 */
.nw{padding:4px 0;height:100%;overflow:auto}
.nw-item{padding:14px 18px;border-bottom:1px solid #f0f0f0;cursor:default}
.nw-item:hover{background:#f7fafd}
.nw-item .t{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:5px}
.nw-item .s{font-size:12.5px;color:#777;line-height:1.6}
.nw-item .m{font-size:11.5px;color:#a8a8a8;margin-top:6px}

/* 画图 */
.pt{display:flex;flex-direction:column;height:100%}
.pt-tools{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #e6e6e6;background:#fafafa;flex-wrap:wrap}
.sw2{width:22px;height:22px;border-radius:3px;border:1px solid rgba(0,0,0,.15);cursor:default}
.sw2.on{outline:2px solid var(--accent);outline-offset:1px}
.pt-canvas{flex:1;overflow:hidden;background:#fff}
.pt-canvas canvas{display:block;cursor:crosshair}

/* 时钟 */
.ck{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fbfbfb}
.ck svg{width:230px;height:230px}
.ck .dig{font-size:38px;font-weight:200;color:#222}
.ck .dt{font-size:14px;color:#777}

/* ---------- 注册表编辑器 ---------- */
.reg{display:flex;flex:1;overflow:hidden;background:#fff}
.reg-side{width:320px;flex:0 0 320px;border-right:1px solid #e6e6e6;overflow:auto;padding:6px 0}
.reg-side .nd{display:flex;align-items:center;gap:3px;padding:2px 6px;font-size:13px;color:#222;white-space:nowrap;cursor:default}
.reg-side .nd:hover{background:#eef3f9}
.reg-side .nd.sel{background:#cfe4f7}
.reg-side .ar{width:14px;flex:0 0 14px;text-align:center;color:#666;font-size:10px}
.reg-side .ic{width:17px;flex:0 0 17px;display:flex;align-items:center;justify-content:center}
.reg-side .ic svg{width:14px;height:14px}
.reg-side .nm{overflow:hidden;text-overflow:ellipsis}
.reg-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.reg-path{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #ececec;background:#fafafa;font-size:12.5px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg-vals{flex:1;overflow:auto}
.reg-status{display:flex;gap:14px;padding:5px 12px;border-top:1px solid #eee;font-size:12px;color:#666;background:#fafafa;flex:0 0 auto}
.reg-status .sp{margin-left:auto;color:#999}
.reg-empty{padding:26px;color:#888;font-size:13px;line-height:1.8}
.reg-vd{color:#333;user-select:text}
.reg-vd.dw{color:#0a62a8}
.files tr.selr td{background:#cfe4f7}

/* ---------- 通用对话框 ---------- */
.mask{position:absolute;inset:0;z-index:9700;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;animation:winIn .14s ease}
.dlg{background:#fff;min-width:340px;max-width:min(520px,92vw);max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:winIn .16s ease}
.dlg h4{margin:0;padding:12px 16px;font-size:14px;background:#f4f4f4;border-bottom:1px solid #e6e6e6;font-weight:600;color:#222}
.dlg .bd{padding:16px 16px 6px}
.dlg .row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px}
.dlg .row.tp{align-items:flex-start}
.dlg .row label{width:78px;flex:0 0 78px;color:#555;padding-top:6px}
.dlg .row.tp label{padding-top:9px}
.dlg input,.dlg select,.dlg textarea{flex:1;border:1px solid #ccc;border-radius:2px;padding:7px 9px;font:inherit;font-size:13px;outline:0;user-select:text;color:#222;background:#fff;min-width:0}
.dlg textarea{resize:vertical;line-height:1.6;font-family:Consolas,"Courier New",monospace}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--accent)}
.dlg .note{font-size:12px;color:#888;margin:2px 0 10px;line-height:1.7}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #eee;background:#fafafa;position:sticky;bottom:0}
.dlg .ft button{min-width:82px;padding:7px 14px;border:1px solid #ccc;background:#fff;font:inherit;font-size:13px;cursor:default;border-radius:2px;color:#333}
.dlg .ft button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.dlg .ft button:hover{filter:brightness(.95)}

/* ---------- 托盘弹出面板（网络 / 声音 / 电池） ---------- */
#trayFly{
  position:absolute;right:6px;bottom:52px;width:min(364px,calc(100vw - 16px));
  z-index:9550;background:#fff;color:#1a1a1a;display:none;
  box-shadow:0 10px 34px rgba(0,0,0,.32),0 0 0 1px rgba(0,0,0,.1);
  animation:fyIn .18s cubic-bezier(.2,.9,.3,1);max-height:calc(100vh - 70px);overflow:auto;
}
#trayFly.open{display:block}
@keyframes fyIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fly-hd{font-size:15px;padding:14px 18px 10px;font-weight:400;color:#111}
.fly-sec{padding:0 8px}
.fly-card{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:3px}
.fly-card:hover{background:#f2f2f2}
.fly-card.on{background:#f2f2f2}
.fly-card .fi{width:20px;height:20px;flex:0 0 20px;color:#333;display:flex;align-items:center;justify-content:center}
.fly-card .fi svg{width:18px;height:18px;fill:currentColor}
.fly-card .ft{flex:1;min-width:0}
.fly-card .ft .t{font-size:13.5px;color:#111}
.fly-card .ft .s{font-size:12px;color:#666;margin-top:2px}
.fly-card .fb{font-size:12.5px;color:#0a62a8;flex:0 0 auto;padding:4px 8px;border-radius:2px}
.fly-card .fb:hover{background:#e6eff8}
.fly-sep{height:1px;background:#e6e6e6;margin:8px 12px}
.fly-lbl{font-size:12px;color:#777;padding:6px 12px 2px}
.fly-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #ececec;margin-top:8px}
.fly-foot .fl{font-size:12.5px;color:#0a62a8;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:2px}
.fly-foot .fl:hover{background:#e6eff8}
.fly-foot .fl svg{width:15px;height:15px;fill:#0a62a8}
.fly-row{display:flex;align-items:center;gap:12px;padding:9px 12px}
.fly-row .ri{width:26px;height:26px;flex:0 0 26px;color:#333;display:flex;align-items:center;justify-content:center}
.fly-row .ri svg{width:20px;height:20px;fill:currentColor}
.fly-row .rt{flex:1;min-width:0}
.fly-row .rt .n{font-size:13px;color:#111;display:flex;justify-content:space-between;gap:8px}
.fly-row .rt .n b{font-weight:400;color:#666;font-variant-numeric:tabular-nums}
.fly-big{display:flex;align-items:center;gap:14px;padding:6px 14px 12px}
.fly-big .bp{font-size:34px;font-weight:300;color:#111;font-variant-numeric:tabular-nums}
.fly-bar{height:6px;background:#e8e8e8;border-radius:3px;overflow:hidden;margin:8px 14px 0}
.fly-bar i{display:block;height:100%;border-radius:3px;transition:width .35s,background .3s}
.fly-st{font-size:12.5px;color:#555;padding:8px 14px 2px;display:flex;align-items:center;gap:8px}
.fly-st svg{width:15px;height:15px;fill:#555;flex:0 0 15px}
.fly-hint{font-size:11.5px;color:#999;padding:6px 14px 10px;line-height:1.6}
.fly-sw{width:40px;height:20px;border-radius:10px;background:#ccc;position:relative;flex:0 0 40px;cursor:default;transition:background .15s}
.fly-sw.on{background:var(--accent)}
.fly-sw i{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.fly-sw.on i{left:23px}
.fly-mode{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 0;font-size:12px;color:#777}
.vsl{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;outline:0;margin:4px 0 0;cursor:default}
.vsl::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--accent) 0 var(--p,60%),#d5d5d5 var(--p,60%) 100%);border-radius:2px}
.vsl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:1px solid rgba(0,0,0,.18);margin-top:-6.5px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.vsl::-moz-range-track{height:3px;background:#d5d5d5;border-radius:2px}
.vsl::-moz-range-progress{height:3px;background:var(--accent);border-radius:2px}
.vsl::-moz-range-thumb{width:15px;height:15px;border:1px solid rgba(0,0,0,.18);border-radius:50%;background:var(--accent)}
.vsl.off::-webkit-slider-runnable-track{background:linear-gradient(90deg,#999 0 var(--p,60%),#d5d5d5 var(--p,60%) 100%)}
.vsl.off::-webkit-slider-thumb{background:#999}
.battery{position:relative}
.battery.chg::before{content:"";position:absolute;left:5px;top:1px;width:12px;height:10px;background:#eaeaea;
  clip-path:polygon(60% 0,20% 55%,48% 55%,35% 100%,78% 40%,50% 40%)}
.battery.low i{background:#e8a33d}
.battery.crit i{background:#d84a3e}
#trayBat.nobat .battery{border-style:dashed;opacity:.9}

/* ---------- 控制面板 ---------- */
.cpl{display:flex;flex-direction:column;height:100%;background:#fff}
.cpl-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #e6e6e6;background:#fafafa;flex:0 0 auto}
.cpl-bar .addr{flex:1}
.cpl-bar select{border:1px solid #ccc;border-radius:2px;padding:4px 6px;font:inherit;font-size:12.5px;background:#fff;color:#333}
.cpl-body{flex:1;overflow:auto;padding:16px 18px}
.cp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cp-head .ico{width:34px;height:34px;flex:0 0 34px}
.cp-head .ico svg{width:100%;height:100%}
.cp-head .tt{font-size:19px;color:#222}
.cp-head .ss{font-size:12.5px;color:#888;margin-top:2px}
.cp-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cp-cat{display:flex;gap:12px;padding:12px 14px;border:1px solid #ececec;border-radius:4px;background:#fdfdfd}
.cp-cat:hover{background:#f4f9fd;border-color:#cfe0ef}
.cp-cat .ci{width:32px;height:32px;flex:0 0 32px}
.cp-cat .ci svg{width:100%;height:100%}
.cp-cat .cn{font-size:13.5px;color:#0a62a8;font-weight:600}
.cp-cat .cl{margin-top:6px;font-size:12.5px;color:#0a62a8;line-height:1.9}
.cp-cat .cl span{cursor:default}
.cp-cat .cl span:hover{text-decoration:underline}
.cp-cat .cd{margin-top:4px;font-size:12px;color:#888;line-height:1.6}
.cp-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cp-icon{padding:12px 6px;text-align:center;border-radius:3px}
.cp-icon:hover{background:#f0f6fc}
.cp-icon .ii{width:40px;height:40px;margin:0 auto 8px}
.cp-icon .ii svg{width:100%;height:100%}
.cp-icon .nm{font-size:12.5px;color:#222;line-height:1.4}
.cp-sec{margin-bottom:18px}
.cp-sec h4{margin:0 0 10px;font-size:13.5px;font-weight:600;color:#333}
.cp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 20px;font-size:12.5px;color:#333}
.cp-grid div{display:flex;justify-content:space-between;border-bottom:1px dotted #e3e3e3;padding:6px 0}
.cp-grid span:first-child{color:#777}
.cp-note{background:#f6f8fa;border-left:3px solid var(--accent);padding:12px 14px;font-size:12.5px;line-height:1.85;color:#444;margin-bottom:16px}
.cp-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cp-btns .rbtn{border:1px solid #ccc;background:#fff}
.cp-swatches{display:flex;gap:10px;flex-wrap:wrap}
.cs{width:56px;height:44px;border-radius:3px;border:2px solid transparent;cursor:default;position:relative}
.cs.on{border-color:#333}
.cs i{position:absolute;right:4px;bottom:3px;font-size:11px;color:#fff;font-style:normal}
.cp-prog{width:100%;border-collapse:collapse;font-size:13px}
.cp-prog th{text-align:left;font-weight:400;color:#666;padding:8px 10px;border-bottom:1px solid #e5e5e5;font-size:12px;background:#fafafa}
.cp-prog td{padding:9px 10px;border-bottom:1px solid #f2f2f2;color:#222;vertical-align:middle}
.cp-prog tr:hover td{background:#f4f8fc}
.cp-prog .pn{display:flex;align-items:center;gap:9px}
.cp-prog .pn svg{width:19px;height:19px;flex:0 0 19px}
.cp-prog .op{text-align:right;white-space:nowrap}
.cp-prog .un{border:1px solid #ccc;background:#fff;font:inherit;font-size:12.5px;padding:4px 10px;border-radius:2px;cursor:default;color:#333}
.cp-prog .un:hover{background:#eef3f9;border-color:#9dc3e6}

    const t = { id: "t" + (++seq), url: EDGE_NT, title: "新标签页", hist: [], hi: -1, nt: null, err: null, blocked: false };
    makeBox(t);
    tabs.push(t);
    cur = tabs.length - 1;
    if (url) nav(url, t, true); else showNT(t);
    setActive(cur);
  }
  function closeTab(i) {
    if (tabs.length <= 1) { tabs[0].box.remove(); tabs = []; newTab(); return; }
    clearTimeout(tabs[i]._tm);
    tabs[i].box.remove();
    tabs.splice(i, 1);
    if (cur >= tabs.length) cur = tabs.length - 1;
    setActive(cur);
  }
  function setActive(i) {
    cur = i;
    tabs.forEach(function (t, k) { t.box.classList.toggle("on", k === i); });
    const t = tabs[i];
    addr.value = t.url === EDGE_NT ? "" : t.url;
    setStatus(t.url === EDGE_NT ? "新标签页" : t.blocked ? "该网站拒绝嵌套显示" : "已完成 · " + t.url, t.blocked ? "bad" : (t.url === EDGE_NT ? "" : "ok"));
    starSync();
    renderTabs();
  }
  function renderTabs() {
    let h = "";
    tabs.forEach(function (t, i) {
      h += '<div class="etab' + (i === cur ? " on" : "") + '" data-t="' + i + '">' + esc(t.title) +
        '<span class="x" data-x="' + i + '">×</span></div>';
    });
    h += '<div class="etab" data-new="1">＋</div>';
    tabsEl.innerHTML = h;
  }
  function starSync() {
    const t = tabs[cur];
    const fav = favLoad();
    const on = t && t.url !== EDGE_NT && fav.some(function (f) { return f.u === t.url; });
    $("#eStar", win).textContent = on ? "★" : "☆";
  }
  tabsEl.addEventListener("click", function (e) {
    const n = e.target.closest("[data-new]");
    if (n) { newTab(); return; }
    const x = e.target.closest("[data-x]");
    if (x) { closeTab(parseInt(x.dataset.x)); return; }
    const b = e.target.closest("[data-t]");
    if (b) setActive(parseInt(b.dataset.t));
  });
  addr.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); nav(addr.value, tabs[cur], true); addr.blur(); }
  });
  addr.addEventListener("focus", function () { addr.select(); });
  $("#eBack", win).addEventListener("click", function () {
    const t = tabs[cur];
    if (t.hi > 0) { t.hi--; nav(t.hist[t.hi], t, false); } else toast("没有更早的历史记录了");
  });
  $("#eFwd", win).addEventListener("click", function () {
    const t = tabs[cur];
    if (t.hi < t.hist.length - 1) { t.hi++; nav(t.hist[t.hi], t, false); } else toast("没有更新的历史记录了");
  });
  $("#eReload", win).addEventListener("click", function () {
    const t = tabs[cur];
    if (!t || t.url === EDGE_NT) return;
    if (t.fr.srcdoc) proxyLoad(t, t.url);
    else { t.fr.removeAttribute("sandbox"); t.fr.removeAttribute("srcdoc"); t.fr.src = t.url; setStatus("正在重新加载…", "busy"); armCheck(t, t.url); }
  });
  $("#eHome", win).addEventListener("click", function () { nav(EDGE_NT, tabs[cur], true); });
  $("#eStar", win).addEventListener("click", function () {
    const t = tabs[cur];
    if (!t || t.url === EDGE_NT) { toast("新标签页无需收藏"); return; }
    let fav = favLoad();
    const i = fav.findIndex(function (f) { return f.u === t.url; });
    if (i >= 0) { fav.splice(i, 1); toast("已取消收藏"); } else { fav.push({ u: t.url, t: t.title }); toast("已加入收藏夹"); }
    favSave(fav); starSync();
    if (t.nt) showNT(t);
  });
  $("#eMenu", win).addEventListener("click", function (e) {
    const t = tabs[cur];
    showCtx(e.clientX, e.clientY, [
      { label: "新建标签页", icon: IC.plus, act: function () { newTab(); } },
      { label: "兼容模式重新加载（代理）", icon: IC.refresh, act: function () { if (t && t.url !== EDGE_NT) proxyLoad(t, t.url); } },
      { label: "复制网页地址", icon: IC.info, act: function () { if (t && t.url !== EDGE_NT) { try { navigator.clipboard.writeText(t.url); } catch (err) {} toast("已复制：" + t.url); } } },
      { sep: true },
      { label: "在系统浏览器中打开", icon: IC.monitor, act: function () { if (t && t.url !== EDGE_NT) window.open(t.url, "_blank", "noopener"); } },
      { label: "清除收藏夹", icon: IC.trash, act: function () { favSave([]); toast("收藏夹已清空"); if (t && t.nt) showNT(t); } }
    ]);
  });
  newTab();
  win.el._cleanup = function () { tabs.forEach(function (t) { clearTimeout(t._tm); clearTimeout(t._tm2); }); };
}

    '<div class="grp">在线音乐</div><div class="it on">推荐</div><div class="it">排行榜</div><div class="it">歌单</div><div class="it">电台</div>' +
    '<div class="grp">我的音乐</div><div class="it">我喜欢</div><div class="it">本地与下载</div><div class="it">最近播放</div></div>' +
    '<div class="kg-main"><div class="kg-cover" id="kgCover">♪</div>' +
    '<div class="kg-title" id="kgTitle">' + SONGS[0].t + '</div>' +
    '<div class="kg-artist" id="kgArtist">' + SONGS[0].a + '</div>' +
    '<div class="kg-prog"><span id="kgCur">0:00</span><div class="pbar" id="kgBar"><i></i></div><span id="kgDur">' + SONGS[0].d + '</span></div>' +
    '<div class="kg-ctrl"><button class="kbtn" id="kgPrev">⏮</button><button class="kbtn play" id="kgPlay">⏸</button>' +
    '<button class="kbtn" id="kgNext">⏭</button></div>' +
    '<div class="plist">' + list + '</div></div></div>';
}
function initKugou(win) {
  let idx = 0, sec = 0, playing = true, timer = null;
  const cover = $("#kgCover", win), title = $("#kgTitle", win), artist = $("#kgArtist", win),
    bar = $("#kgBar", win), fill = bar.querySelector("i"), cur = $("#kgCur", win), dur = $("#kgDur", win),
    playBtn = $("#kgPlay", win);
  function tot(d) { const p = d.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]); }
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
  function load(i) {
    idx = (i + SONGS.length) % SONGS.length;
    sec = 0;
    const s = SONGS[idx];
    title.textContent = s.t; artist.textContent = s.a; dur.textContent = s.d;
    cover.style.background = s.c;
    $$(".prow", win).forEach(function (r, k) { r.classList.toggle("on", k === idx); });
    render();
  }
  function render() {
    const t = tot(SONGS[idx].d);
    fill.style.width = (sec / t * 100) + "%";
    cur.textContent = fmt(sec);
  }
  function tick() { if (!playing) return; sec++; if (sec >= tot(SONGS[idx].d)) load(idx + 1); else render(); }
  timer = setInterval(tick, 1000);
  playBtn.addEventListener("click", function () {
    playing = !playing;
    playBtn.textContent = playing ? "⏸" : "▶";
    cover.classList.toggle("spin", playing);
  });
  $("#kgNext", win).addEventListener("click", function () { load(idx + 1); });
  $("#kgPrev", win).addEventListener("click", function () { load(idx - 1); });
  bar.addEventListener("click", function (e) {
    const r = bar.getBoundingClientRect();
    sec = Math.floor((e.clientX - r.left) / r.width * tot(SONGS[idx].d));
    render();
  });
  win.querySelector(".plist").addEventListener("click", function (e) {
    const r = e.target.closest(".prow");
    if (r) load(parseInt(r.dataset.i));
  });
  cover.classList.add("spin");
  win._cleanup = function () { clearInterval(timer); };
}

];
const WALL_KEY = "w10_custom_wall";
let NIGHT = false, WALL_BEFORE_NIGHT = "";
let CUSTOM_WALL = "";
let WALL_FIT = "cover";

function applyWall() {
  const d = $("#desktop");
  if (CUSTOM_WALL) {
    d.style.backgroundImage = "url(" + CUSTOM_WALL + ")";
    d.style.backgroundSize = WALL_FIT === "stretch" ? "100% 100%" : WALL_FIT === "center" ? "auto" : "cover";
    d.style.backgroundRepeat = "no-repeat";
    d.style.backgroundPosition = "center";
  } else {
    d.style.backgroundImage = "";
    d.style.backgroundSize = "";
    d.style.backgroundRepeat = "";
    d.style.backgroundPosition = "";
  }
}
function setWall(cls) {
  const d = $("#desktop");
  d.className = cls || "";
  applyWall();
}
function saveCustomWall(data) {
  CUSTOM_WALL = data;
  try {
    if (data) sessionStorage.setItem(WALL_KEY, data); else sessionStorage.removeItem(WALL_KEY);
  } catch (e) {}
  applyWall();
}
function restoreCustomWall() {
  let v = "";
  try { v = sessionStorage.getItem(WALL_KEY) || ""; } catch (e) {}
  if (v) { CUSTOM_WALL = v; applyWall(); }
}
function onWallFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast("请选择一张图片文件"); return; }
  const fr = new FileReader();
  fr.onload = function () { saveCustomWall(String(fr.result)); toast("壁纸已应用（关闭页面后自动删除）"); };
  fr.onerror = function () { toast("读取图片失败"); };
  fr.readAsDataURL(file);
}

function initSettings(win) {
  const side = $(".stg-side", win), main = $("#stgMain", win);
  function bind() {
    const fi = $("#wpFile", main);
    if (fi) fi.addEventListener("change", function () { onWallFile(fi.files && fi.files[0]); });
  }
  function go(k) {
    $$(".it", side).forEach(function (x) { x.classList.remove("on"); });
    const t = side.querySelector('[data-pg="' + k + '"]');
    if (t) t.classList.add("on");
    main.innerHTML = STG_PAGES[k].html();
    bind();
  }
  side.addEventListener("click", function (e) {
    const it = e.target.closest(".it");
    if (it) go(it.dataset.pg);
  });
  main.addEventListener("click", function (e) {
    const sw = e.target.closest("[data-sw]");
    if (sw) {
      const on = !sw.classList.contains("on");
      sw.classList.toggle("on", on);
      if (sw.dataset.sw === "pers.night" || sw.dataset.sw === "sys.night") {
        NIGHT = on;
        if (NIGHT) { WALL_BEFORE_NIGHT = $("#desktop").className; setWall("wall-dark"); }
        else setWall(WALL_BEFORE_NIGHT);
        document.body.style.filter = NIGHT ? "brightness(.88)" : "";
        const act = document.querySelector('.ac-tile[data-ac="night"]');
        if (act) act.classList.toggle("on", NIGHT);
      }
      if (sw.dataset.sw === "pers.blur") {
        document.querySelectorAll("#taskbar,#startMenu,#actionCenter,#calendar,#powerMenu").forEach(function (x) {
          x.style.backdropFilter = on ? "" : "none";
        });
      }
      if (sw.dataset.sw === "sys.lock") {
        BOOT_LOCK = on;
        try { localStorage.setItem("w10_boot_lock", on ? "1" : "0"); } catch (e) {}
        toast(on ? "下次启动会先显示锁屏界面" : "下次启动直接进入桌面");
        return;
      }
      if (sw.dataset.sw === "sys.locknow") { showLock(); return; }
      return;
    }
    const wp = e.target.closest(".wp");
    if (wp) {
      if (wp.classList.contains("up")) { const fi = $("#wpFile", main); if (fi) fi.click(); return; }
      if (wp.dataset.custom) return;
      $$(".wp", main).forEach(function (x) { x.classList.remove("on"); });
      wp.classList.add("on");
      saveCustomWall("");
      setWall(wp.dataset.cls);
      return;
    }
    const fit = e.target.closest("[data-fit]");
    if (fit) {
      WALL_FIT = fit.dataset.fit;
      applyWall();
      $$("[data-fit]", main).forEach(function (x) { x.classList.toggle("on2", x.dataset.fit === WALL_FIT); });
      return;
    }
    if (e.target.closest("[data-lock]")) { showLock(); return; }
    if (e.target.closest("#wpRemove")) {
      saveCustomWall("");
      go("pers");
      toast("已移除自定义壁纸");
      return;
    }
    if (e.target.closest("#btnUpd")) {
      const m = $("#updMsg", main), b = $("#btnUpd", main);
      b.textContent = "正在检查…";
      m.textContent = "正在联系更新服务…";
      setTimeout(function () {
        b.textContent = "检查更新";
        m.textContent = "上次检查时间：刚刚　你的设备已是最新版本";
        toast("没有可用的更新");
      }, 1500);
      return;
    }
    const un = e.target.closest("[data-un]");
    if (un) { toast("模拟器中的应用无法卸载"); return; }
    const lk = e.target.closest("[data-link]");
    if (lk) {
      const map = { about: function () { openApp("about"); }, cpl: function () { openApp("control"); }, lang: function () { toast("语言包需要联网下载，模拟器暂不支持"); }, clear: function () { toast("浏览数据已清除（模拟）"); } };
      toast("「" + lk.querySelector(".t").textContent + "」在模拟器中仅作展示");
      if (map[lk.dataset.link]) map[lk.dataset.link]();
    }
  });
  bind();
}

/* ================= 计算器 ================= */
function renderCalc() {
  const keys = [
    ["%", "fn"], ["CE", "fn"], ["C", "fn"], ["⌫", "fn"],
    ["1/x", "fn"], ["x²", "fn"], ["√", "fn"], ["÷", "fn"],
    ["7", ""], ["8", ""], ["9", ""], ["×", "fn"],
    ["4", ""], ["5", ""], ["6", ""], ["−", "fn"],
    ["1", ""], ["2", ""], ["3", ""], ["+", "fn"],
    ["±", ""], ["0", ""], [".", ""], ["=", "eq"]
  ];
  let h = '<div class="calc"><div class="calc-disp"><div class="expr" id="cExpr"></div><div id="cVal">0</div></div><div class="calc-keys">';
  keys.forEach(function (k) { h += '<button class="' + k[1] + '" data-k="' + k[0] + '">' + k[0] + '</button>'; });
  return h + "</div></div>";
}
function initCalc(win) {
  let val = "0", prev = null, op = null, fresh = true;
  const vEl = $("#cVal", win), eEl = $("#cExpr", win);
  function set(v) { val = v; vEl.textContent = val; }
  function calc() {
    const a = parseFloat(prev), b = parseFloat(val);
    let r = 0;
    if (op === "+") r = a + b; else if (op === "−") r = a - b;
    else if (op === "×") r = a * b; else if (op === "÷") r = b === 0 ? NaN : a / b;
    return isNaN(r) ? "除数不能为零" : String(Math.round(r * 1e10) / 1e10);
  }
  win.querySelector(".calc-keys").addEventListener("click", function (e) {
    const b = e.target.closest("button");
    if (!b) return;
    const k = b.dataset.k;
    if (/^[0-9]$/.test(k)) { set(fresh || val === "0" ? k : val + k); fresh = false; }
    else if (k === ".") { if (val.indexOf(".") < 0) set(val + "."); fresh = false; }
    else if (k === "+" || k === "−" || k === "×" || k === "÷") {
      if (op && !fresh) { set(calc()); }
      prev = val; op = k; fresh = true; eEl.textContent = prev + " " + k;
    }
    else if (k === "=") {
      if (op) { eEl.textContent = prev + " " + op + " " + val + " ="; set(calc()); op = null; prev = null; fresh = true; }
    }
    else if (k === "C" || k === "CE") { set("0"); prev = null; op = null; fresh = true; eEl.textContent = ""; }
    else if (k === "⌫") { set(val.length > 1 ? val.slice(0, -1) : "0"); }
    else if (k === "±") { set(val[0] === "-" ? val.slice(1) : "-" + val); }
    else if (k === "%") { set(String(parseFloat(val) / 100)); }
    else if (k === "1/x") { set(String(Math.round(1 / parseFloat(val) * 1e10) / 1e10)); }
    else if (k === "x²") { set(String(Math.round(Math.pow(parseFloat(val), 2) * 1e10) / 1e10)); }
    else if (k === "√") { set(String(Math.round(Math.sqrt(parseFloat(val)) * 1e10) / 1e10)); }
  });
}

    if (cmd === "help") {
      print("可用命令：help  dir  ver  echo  date  time  whoami  ipconfig  cls  start &lt;应用名&gt;  lock  shutdown  exit");
    } else if (cmd === "dir") {

      FILES.quick.forEach(function (f) {

      });

    } else if (cmd === "ver") {
      print("Microsoft Windows [版本 10.0.19045.4046]");
    } else if (cmd.indexOf("echo ") === 0) {
      print(esc(c.slice(5)));
    } else if (cmd === "date") {
      print("当前日期: " + new Date().toLocaleDateString("zh-CN"));
    } else if (cmd === "time") {
      print("当前时间: " + new Date().toLocaleTimeString("zh-CN"));
    } else if (cmd === "whoami") {
      print("yelan-pc\\yelan");
    } else if (cmd === "ipconfig") {
      print("以太网适配器 以太网:<br>&nbsp;&nbsp;&nbsp;IPv4 地址 . . . . . . . . . : 192.168.1.66<br>&nbsp;&nbsp;&nbsp;子网掩码&nbsp; . . . . . . . . : 255.255.255.0<br>&nbsp;&nbsp;&nbsp;默认网关 . . . . . . . . . : 192.168.1.1");

      out.innerHTML = '<div class="cmdrow"><span class="p">C:\\Users\\yelan&gt;</span></div>';
      out.appendChild(inp.parentNode);
      return;
    } else if (cmd.indexOf("start ") === 0) {
      const key = cmd.slice(6).trim();
      const map = { notepad: "notepad", kugou: "kugou", edge: "edge", calc: "calc", settings: "settings", mypc: "mypc", pc: "mypc", recycle: "recycle", photos: "photos", regedit: "regedit", reg: "regedit", control: "control", panel: "control", msconfig: "settings", taskmgr: "taskmgr", paint: "paint", clock: "clock", weather: "weather", news: "news", about: "about", office: "office", store: "store", mail: "mail" };
      if (map[key]) { openApp(map[key]); print("已启动 " + key); }
      else print("'start " + esc(key) + "' 无法找到指定的应用。");
    } else if (cmd === "exit") {
      closeWindow(win._id);
      return;
    } else if (cmd === "lock" || cmd === "rundll32.exe user32.dll,lockworkstation") {
      print("正在锁定工作站…");
      setTimeout(function () { showLock(); }, 350);
    } else if (cmd === "shutdown" || cmd === "shutdown /s") {
      print("系统将在 1 秒后关机…");
      setTimeout(function () { power("正在关机…"); }, 800);
    } else {
      print("'" + esc(c) + "' 不是内部或外部命令，也不是可运行的程序。");
    }
  }
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      const v = inp.value;
      inp.value = "";
      run(v);
    }
  });
  setTimeout(function () { inp.focus(); }, 60);
}

function drawGraph(cv, data, color, max) {
  const w = cv.width, h = cv.height;
  const g = cv && cv.getContext ? cv.getContext("2d") : null;
  if (!g) return;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = "#ececec";
  g.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke();
  }
  if (data.length < 2) return;
  const pts = data.map(function (v, i) {
    return [i / (data.length - 1) * w, h - Math.min(1, v / max) * (h - 6) - 3];
  });
  g.beginPath();
  g.moveTo(pts[0][0], h);
  pts.forEach(function (p) { g.lineTo(p[0], p[1]); });
  g.lineTo(w, h);
  g.closePath();
  g.fillStyle = "rgba(0,120,215,.14)";
  g.fill();
  g.beginPath();
  pts.forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
  g.strokeStyle = color;
  g.lineWidth = 1.6;
  g.stroke();
}

function initTaskmgr(win) {
  const body = $("#tmBody", win);
  const sum = $("#tmSum", win);
  let tab = "proc", sel = null, timerA = null, timerB = null;
  const series = { cpu: [], ram: [], gpu: [], disk: [], net: [] };
  let cvs = null;
  const BASE = [14, 36, 9, 7, 24];
  ["cpu", "ram", "gpu", "disk", "net"].forEach(function (k, i) {
    for (let j = 0; j < 45; j++) {
      series[k].push(Math.max(0, Math.min(100, BASE[i] + (Math.random() - 0.5) * 12)));
    }
  });

  function showProc() {
    const list = TM_PROCS.slice().sort(function (a, b) { return b.cpu - a.cpu; });
    body.innerHTML = tmProcsHTML(list, sel);
  }
  function updateSum() {
    let c = 0, m = 0, d = 0;
    TM_PROCS.forEach(function (p) { c += p.cpu; m += p.mem; d += p.disk; });
    sum.textContent = "CPU " + c.toFixed(0) + "% · 内存 " + (m / 1024).toFixed(1) +
      " GB · 磁盘 " + d.toFixed(1) + " MB/秒 · 进程 " + TM_PROCS.length;
  }
  function graphs() {
    if (tab !== "perf" || !cvs) return;
    ["cpu", "ram", "gpu", "disk", "net"].forEach(function (k, i) {
      const s = series[k];
      const v = s[s.length - 1] || 0;
      const map = { cpu: ["#pCpuV", "#pCpuU"], ram: ["#pRamV", "#pRamU"], gpu: ["#pGpuV", "#pGpuU"], disk: ["#pDiskV", "#pDiskW"], net: ["#pNetV", "#pNetS"] };
      const e1 = $(map[k][0], win), e2 = $(map[k][1], win);
      if (e1) e1.textContent = (k === "net" ? v.toFixed(1) + " Mbps" : v.toFixed(0) + "%");
      if (e2) {
        if (k === "ram") e2.textContent = (v / 100 * 512).toFixed(1) + " GB";
        else if (k === "gpu") e2.textContent = (v / 100 * 16).toFixed(1) + " GB";
        else if (k === "disk") e2.textContent = (v * 4.2).toFixed(1) + " MB/秒";
        else if (k === "net") e2.textContent = v.toFixed(1) + " Mbps";
        else e2.textContent = v.toFixed(0) + "%";
      }
      drawGraph(cvs[i], s, ["#0078d7", "#7b4fc9", "#2ec5a8", "#e08a1e", "#0f7fc0"][i], 100);
    });
    const rv = series.ram[series.ram.length - 1] || 0;
    const rf = $("#pRamF", win);
    if (rf) rf.textContent = (512 - rv / 100 * 512).toFixed(1) + " GB";
    const dr = $("#pDiskR", win), nr = $("#pNetR", win);
    if (dr) dr.textContent = ((series.disk[series.disk.length - 1] || 0) * 3.1).toFixed(1) + " MB/秒";
    if (nr) nr.textContent = ((series.net[series.net.length - 1] || 0) * 1.7).toFixed(1) + " Mbps";
  }
  function tick() {
    TM_PROCS.forEach(function (p) {
      const base = p.t === "sys" ? 0 : p.cpu;
      p.cpu = Math.max(0, Math.min(100, base + (Math.random() - 0.5) * 1.4));
      p.mem = Math.max(0, p.mem + (Math.random() - 0.5) * 6);
      p.disk = Math.max(0, p.disk + (Math.random() - 0.5) * 0.2);
      p.net = Math.max(0, p.net + (Math.random() - 0.5) * 0.4);
    });
    ["cpu", "ram", "gpu", "disk", "net"].forEach(function (k, i) {
      const cur = [12, 34, 8, 6, 22][i];
      const prev = series[k].length ? series[k][series[k].length - 1] : cur;
      series[k].push(Math.max(0, Math.min(100, prev + (Math.random() - 0.5) * 18 + (cur - prev) * 0.25)));
      if (series[k].length > 60) series[k].shift();
    });
    if (tab === "proc") showProc();
    updateSum();
    graphs();
  }
  function switchTab(t) {
    tab = t;
    $$(".tm-tab", win).forEach(function (x) { x.classList.toggle("on", x.dataset.t === t); });
    if (t === "proc") showProc();
    else if (t === "perf") {
      body.innerHTML = tmPerfHTML();
      cvs = ["#gCpu", "#gRam", "#gGpu", "#gDisk", "#gNet"].map(function (s) { return $(s, win); });
      cvs.forEach(function (c) { c.width = c.clientWidth * 2 || 400; c.height = 160; });
      graphs();
    } else if (t === "start") body.innerHTML = tmStartupHTML();
    else body.innerHTML = tmDetailHTML();
  }
  $(".tm-tabs", win).addEventListener("click", function (e) {
    const t = e.target.closest(".tm-tab");
    if (t) switchTab(t.dataset.t);
  });
  body.addEventListener("click", function (e) {
    const tr = e.target.closest("tr[data-p]");
    if (!tr) return;
    sel = tr.dataset.p;
    $$("tr[data-p]", body).forEach(function (x) { x.classList.remove("sel"); });
    tr.classList.add("sel");
  });
  $("#tmEnd", win).addEventListener("click", function () {
    if (!sel) { toast("请先选择一个进程"); return; }
    if (sel === "系统空闲进程" || sel === "系统中断") { toast("无法结束系统关键进程"); return; }
    const i = TM_PROCS.findIndex(function (p) { return p.n === sel; });
    if (i >= 0) TM_PROCS.splice(i, 1);
    sel = null;
    showProc();
    toast("已结束任务");
  });
  $("#tmNew", win).addEventListener("click", function () {
    const v = prompt("运行新任务", "notepad");
    if (!v) return;
    const map = { notepad: "notepad", calc: "calc", cmd: "cmd", kugou: "kugou", edge: "edge", mypc: "mypc", taskmgr: "taskmgr", msedge: "edge", explorer: "mypc" };
    const key = map[v.toLowerCase().replace(".exe", "")];
    if (key) { openApp(key); toast("已启动 " + v); }
    else toast("找不到 “" + v + "”，试试 notepad / calc / cmd / kugou");
  });
  switchTab("proc");
  updateSum();
  timerA = setInterval(tick, 1000);
  win._cleanup = function () { clearInterval(timerA); clearInterval(timerB); };
}

    '<span style="width:1px;height:20px;background:#ddd;margin:0 4px"></span>' +

    '<span style="font-size:12px;color:#888">按住鼠标 / 手指即可涂鸦</span></div>' +
    '<div class="pt-canvas"><canvas id="ptC"></canvas></div></div>';
}
function initPaint(win) {
  const box = $(".pt-canvas", win), cv = $("#ptC", win);
  let color = "#000000", size = 8, drawing = false;
  function fit() {
    const w = box.clientWidth, h = box.clientHeight;
    let old = null;
    try { if (cv.width) old = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height); } catch (e) {}
    cv.width = w; cv.height = h;
    const g = cv.getContext("2d");
    if (!g) return;
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
    if (old) { try { g.putImageData(old, 0, 0); } catch (e) {} }
    g.lineCap = "round"; g.lineJoin = "round";
  }
  setTimeout(fit, 30);
  function pos(e) {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  cv.addEventListener("pointerdown", function (e) {
    drawing = true;
    cv.setPointerCapture(e.pointerId);
    const p = pos(e), g = cv.getContext("2d");
    g.strokeStyle = color; g.lineWidth = size;
    g.beginPath(); g.moveTo(p[0], p[1]);
  });
  cv.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    const p = pos(e), g = cv.getContext("2d");
    g.lineTo(p[0], p[1]); g.stroke();
  });
  cv.addEventListener("pointerup", function () { drawing = false; });
  $(".pt-tools", win).addEventListener("click", function (e) {
    const c = e.target.closest(".sw2");
    if (c) {
      color = c.dataset.c;
      $$(".sw2", win).forEach(function (x) { x.classList.remove("on"); });
      c.classList.add("on");
      return;
    }
    const b = e.target.closest("[data-sz]");
    if (b) size = parseInt(b.dataset.sz);
    if (e.target.closest("#ptClear")) {
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
    }
  });
}

      if (inName || inData) out.push({ path: p.slice(), v: v, where: inName ? "名称" : "数据" });
    });
    Object.keys(node.k || {}).forEach(function (name) {
      if (name.toLowerCase().indexOf(q) >= 0) out.push({ path: p.concat([name]), v: null, where: "项" });
      walk(p.concat([name]), node.k[name]);
    });
  })([], { k: REG, v: [] });
  return out.slice(0, 200);
}

function initRegedit(win) {
  const treeEl = $("#regTree", win), valsEl = $("#regVals", win);
  const pathEl = $("#regPath", win), statEl = $("#regStat", win), cntEl = $("#regCount", win);
  const fileInput = $("#regFile", win);
  let path = ["HKEY_CURRENT_USER"], selVal = -1;
  const OPEN = { "HKEY_CURRENT_USER": true, "HKEY_CURRENT_USER\\Software": true };
  const P = function (p) { return p.join("\\"); };

  function commit(msg) { regSave(); regApply(); if (msg) toast(msg); renderAll(); }
  function renderAll() { renderTree(); renderVals(); }

  function renderTree() {
    let h = '<div class="nd' + (path.length === 0 ? " sel" : "") + '" data-p="" style="padding-left:6px">' +
      '<span class="ar">▸</span><span class="ic">' + IC.pc + '</span><span class="nm">计算机</span></div>';
    Object.keys(REG).forEach(function (rk) { walk(rk, [rk], 1); });
    function walk(name, p, depth) {
      const n = regAt(p) || {};
      const kids = n.k || {};
      const cnt = Object.keys(kids).length;
      const op = !!OPEN[P(p)];
      h += '<div class="nd' + (P(p) === P(path) ? " sel" : "") + '" data-p="' + esc(P(p)) + '" style="padding-left:' + (6 + depth * 15) + 'px">' +
        '<span class="ar" data-t="' + esc(P(p)) + '">' + (cnt ? (op ? "▾" : "▸") : "") + "</span>" +
        '<span class="ic">' + (depth === 1 ? IC.reghive : IC.regkey) + '</span><span class="nm">' + esc(name) + "</span></div>";
      if (op) Object.keys(kids).forEach(function (c) { walk(c, p.concat([c]), depth + 1); });
    }
    treeEl.innerHTML = h;
  }

  function renderVals() {
    const n = regAt(path);
    pathEl.textContent = "计算机\\" + path.join("\\");
    if (!n) { valsEl.innerHTML = '<div class="reg-empty">该项不存在。</div>'; cntEl.textContent = ""; return; }
    const vals = n.v || [];
    const kids = Object.keys(n.k || {}).length;
    cntEl.textContent = vals.length + " 个值 · " + kids + " 个子项";
    if (!vals.length) {
      valsEl.innerHTML = '<table class="files"><thead><tr><th style="width:34%">名称</th><th style="width:24%">类型</th><th>数据</th></tr></thead>' +
        '<tbody><tr data-i="-1"><td>（默认）</td><td>REG_SZ</td><td class="reg-vd">（数值未设置）</td></tr></tbody></table>' +
        '<div class="reg-empty">此项目前没有数值。<br>在右侧空白处右键 → 新建 可以添加；双击数值可以修改。</div>';
      return;
    }
    let h = '<table class="files"><thead><tr><th style="width:34%">名称</th><th style="width:24%">类型</th><th>数据</th></tr></thead><tbody>';
    vals.forEach(function (v, i) {
      h += '<tr class="' + (i === selVal ? "selr" : "") + '" data-i="' + i + '"><td>' + esc(v.n) + "</td><td>" + esc(v.t) + "</td>" +
        '<td class="reg-vd' + (v.t === "REG_DWORD" || v.t === "REG_QWORD" ? " dw" : "") + '">' + esc(regDisp(v)) + "</td></tr>";
    });
    h += "</tbody></table>";
    valsEl.innerHTML = h;
  }

  function editValue(i) {
    const n = regAt(path);
    if (!n || !n.v) return;
    if (i < 0 || !n.v[i]) {
      dlgBox({
        title: "修改（默认）值", rows: [{ label: "数值数据", type: "text", value: "" }],
        note: "类型固定为 REG_SZ", ok: "确定",
        onOk: function (v) {
          n.v.push({ n: "(默认)", t: "REG_SZ", d: v[0] });
          commit("已写入注册表（本地保存）");
        }
      });
      return;
    }
    const v0 = n.v[i];
    dlgBox({
      title: "编辑字符串" ,
      rows: [
        { label: "数值名称", type: "text", value: v0.n },
        { label: "数值类型", type: "select", value: v0.t, options: REG_TYPES },
        { label: "数值数据", type: "textarea", value: String(v0.d == null ? "" : v0.d), rows: 4 }
      ],
      note: "REG_DWORD / REG_QWORD 可填 10 进制或 0x 十六进制；REG_BINARY 填十六进制字节，如 01 00 00 00",
      ok: "确定",
      onOk: function (v) {
        const name = v[0].trim() || v0.n;
        const t = v[1];
        let d = v[2];
        if (t === "REG_DWORD" || t === "REG_QWORD") {
          const num = /^0x/i.test(d.trim()) ? parseInt(d.trim(), 16) : parseInt(d.trim(), 10);
          if (isNaN(num)) { toast("数值数据不是合法数字，已按 0 处理"); d = "0"; }
          else d = /^0x/i.test(v[2].trim()) ? v[2].trim() : "0x" + (num >>> 0).toString(16);
        }
        n.v[i] = { n: name, t: t, d: d };
        commit("已写入注册表（本地保存）" + (path.join("\\").indexOf("Simulator") >= 0 ? "，相关设置已生效" : ""));
      }
    });
  }
  function newValue(type) {
    const n = regAt(path);
    if (!n) return;
    dlgBox({
      title: "新建 " + type,
      rows: [
        { label: "数值名称", type: "text", value: type === "REG_SZ" ? "新值 #1" : "新值" },
        { label: "数值数据", type: "textarea", value: type.indexOf("DWORD") >= 0 ? "0" : "", rows: 3 }
      ],
      note: type.indexOf("DWORD") >= 0 ? "可填 10 进制或 0x 十六进制" : "",
      ok: "确定",
      onOk: function (v) {
        const name = v[0].trim();
        if (!name) { toast("名称不能为空"); return; }
        n.v.push({ n: name, t: type, d: v[1] });
        commit("已新建 " + type + "（本地保存）");
      }
    });
  }
  function newKey() {
    const n = regAt(path);
    if (!n) return;
    dlgBox({
      title: "新建项", rows: [{ label: "项名称", type: "text", value: "新项 #1" }], ok: "创建",
      onOk: function (v) {
        const name = v[0].trim();
        if (!name) { toast("名称不能为空"); return; }
        if (/[\\\/]/.test(name)) { toast("名称不能包含反斜杠"); return; }
        n.k[name] = RN({}, []);
        OPEN[P(path)] = true;
        OPEN[P(path.concat([name]))] = true;
        path = path.concat([name]);
        commit("已创建项：" + name);
      }
    });
  }
  function renameKey() {
    if (path.length < 1) return;
    const parent = path.slice(0, -1), old = path[path.length - 1];
    if (parent.length === 0) { toast("五个根项不能重命名"); return; }
    const pn = regAt(parent);
    dlgBox({
      title: "重命名项", rows: [{ label: "项名称", type: "text", value: old }], ok: "重命名",
      onOk: function (v) {
        const name = v[0].trim();
        if (!name || name === old) return;
        pn.k[name] = pn.k[old];
        delete pn.k[old];
        path = parent.concat([name]);
        commit("已重命名为：" + name);
      }
    });
  }
  function deleteKey() {
    if (path.length < 1) return;
    const parent = path.slice(0, -1), name = path[path.length - 1];
    if (parent.length === 0) { toast("五个根项不能删除"); return; }
    confirmBox("删除项「" + name + "」及其全部子项与数值？此操作不可撤销。", function () {
      const pn = regAt(parent);
      delete pn.k[name];
      path = parent.slice();
      commit("已删除项：" + name);
    });
  }
  function doFind() {
    dlgBox({
      title: "查找", rows: [{ label: "查找内容", type: "text", value: "" }], ok: "查找",
      note: "在项名称、值名称与数值数据中搜索，最多显示 200 条",
      onOk: function (v) {
        const res = regFindAll(v[0]);
        if (!res.length) { toast("没有找到匹配项"); return; }
        statEl.textContent = "找到 " + res.length + " 条匹配";
        let h = '<table class="files"><thead><tr><th style="width:40%">位置</th><th style="width:16%">匹配</th><th>内容</th></tr></thead><tbody>';
        res.forEach(function (r, i) {
          h += '<tr data-f="' + i + '"><td>' + esc("计算机\\" + r.path.join("\\")) + "</td><td>" + esc(r.where) + "</td>" +
            '<td class="reg-vd">' + esc(r.v ? r.v.n + " = " + regDisp(r.v) : r.path[r.path.length - 1]) + "</td></tr>";
        });
        h += "</tbody></table>";
        valsEl.innerHTML = h;
        valsEl.querySelectorAll("[data-f]").forEach(function (tr) {
          tr.addEventListener("click", function () {
            const r = res[parseInt(tr.dataset.f)];
            if (r.v) { path = r.path.slice(); r.path.forEach(function (_, i2) { OPEN[P(r.path.slice(0, i2 + 1))] = true; }); }
            else { path = r.path.slice(); r.path.forEach(function (_, i2) { OPEN[P(r.path.slice(0, i2 + 1))] = true; }); }
            renderAll();
            statEl.textContent = "已跳转到：" + P(path);
          });
        });
      }
    });
  }
  function exportKey() {
    const txt = regExportText(path);
    const name = path[path.length - 1] || "注册表";
    try {
      const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name + ".reg";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
      toast("已导出 " + name + ".reg");
    } catch (e) { toast("当前环境不支持导出文件"); }
  }
  fileInput.addEventListener("change", function () {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = function () {
      const n = regImportText(String(fr.result));
      fileInput.value = "";
      commit("已导入 " + n + " 条记录");
    };
    fr.readAsText(f, "utf-8");
  });

  treeEl.addEventListener("click", function (e) {
    const ar = e.target.closest("[data-t]");
    if (ar) {
      const p = ar.dataset.t;
      if (p) OPEN[p] = !OPEN[p];
      renderTree();
      return;
    }
    const nd = e.target.closest("[data-p]");
    if (!nd) return;
    path = nd.dataset.p ? nd.dataset.p.split("\\") : [];
    selVal = -1;
    $$(".nd", treeEl).forEach(function (x) { x.classList.toggle("sel", x === nd); });
    renderVals();
  });
  treeEl.addEventListener("dblclick", function (e) {
    const nd = e.target.closest("[data-p]");
    if (!nd || !nd.dataset.p) return;
    const p = nd.dataset.p;
    OPEN[p] = !OPEN[p];
    renderTree();
  });
  treeEl.addEventListener("contextmenu", function (e) {
    const nd = e.target.closest("[data-p]");
    e.preventDefault(); e.stopPropagation();
    if (nd && nd.dataset.p) path = nd.dataset.p.split("\\");
    renderAll();
    if (path.length === 0) return;
    showCtx(e.clientX, e.clientY, [
      { label: "新建项", icon: IC.plus, act: newKey },
      { label: "重命名", icon: IC.info, act: renameKey },
      { sep: true },
      { label: "复制项名称", icon: IC.info, act: function () { try { navigator.clipboard.writeText(P(path)); } catch (err) {} toast("已复制：" + P(path)); } },
      { label: "导出此项 (.reg)", icon: IC.doc, act: exportKey },
      { sep: true },
      { label: "删除", icon: IC.trash, act: deleteKey }
    ]);
  });

  valsEl.addEventListener("click", function (e) {
    const tr = e.target.closest("[data-i]");
    if (!tr || tr.dataset.f !== undefined) return;
    selVal = parseInt(tr.dataset.i);
    $$("tr[data-i]", valsEl).forEach(function (x) { x.classList.toggle("selr", x === tr); });
  });
  valsEl.addEventListener("dblclick", function (e) {
    const tr = e.target.closest("[data-i]");
    if (!tr) return;
    editValue(parseInt(tr.dataset.i));
  });
  valsEl.addEventListener("contextmenu", function (e) {
    e.preventDefault(); e.stopPropagation();
    const tr = e.target.closest("[data-i]");
    if (tr) {
      const i = parseInt(tr.dataset.i);
      const n = regAt(path);
      showCtx(e.clientX, e.clientY, [
        { label: "修改…", icon: IC.settings, act: function () { editValue(i); } },
        { label: "重命名", icon: IC.info, act: function () { editValue(i); } },
        { sep: true },
        { label: "删除", icon: IC.trash, act: function () {
            if (!n || !n.v[i]) return;
            confirmBox("删除数值「" + n.v[i].n + "」？", function () { n.v.splice(i, 1); selVal = -1; commit("已删除数值（本地保存）"); });
          } }
      ]);
      return;
    }
    showCtx(e.clientX, e.clientY, [
      { label: "新建 字符串值 (REG_SZ)", icon: IC.doc, act: function () { newValue("REG_SZ"); } },
      { label: "新建 DWORD (32 位) 值", icon: IC.doc, act: function () { newValue("REG_DWORD"); } },
      { label: "新建 QWORD (64 位) 值", icon: IC.doc, act: function () { newValue("REG_QWORD"); } },
      { sep: true },
      { label: "新建 二进制值", icon: IC.doc, act: function () { newValue("REG_BINARY"); } },
      { label: "新建 多字符串值", icon: IC.doc, act: function () { newValue("REG_MULTI_SZ"); } },
      { label: "新建 可扩充字符串值", icon: IC.doc, act: function () { newValue("REG_EXPAND_SZ"); } },
      { sep: true },
      { label: "新建项", icon: IC.plus, act: newKey }
    ]);
  });

  $(".ribbon", win).addEventListener("click", function (e) {
    const b = e.target.closest("[data-rm]");
    if (!b) return;
    const r = $(".ribbon", win).getBoundingClientRect();
    const map = {
      file: [
        { label: "导入…（.reg 文件）", icon: IC.doc, act: function () { fileInput.click(); } },
        { label: "导出当前项…（.reg 文件）", icon: IC.doc, act: exportKey },
        { sep: true },
        { label: "重置为默认注册表", icon: IC.refresh, act: function () {
            confirmBox("把整个注册表恢复为模拟器的默认值？所有的修改都会丢失。", function () {
              REG = regDefault(); path = ["HKEY_CURRENT_USER"]; commit("注册表已重置");
            });
          } },
        { sep: true },
        { label: "关闭", icon: IC.trash, act: function () { closeWindow(win.id); } }
      ],
      edit: [
        { label: "新建项", icon: IC.plus, act: newKey },
        { label: "新建 字符串值", icon: IC.doc, act: function () { newValue("REG_SZ"); } },
        { label: "新建 DWORD (32 位) 值", icon: IC.doc, act: function () { newValue("REG_DWORD"); } },
        { sep: true },
        { label: "查找…", icon: IC.info, act: doFind },
        { sep: true },
        { label: "删除当前项", icon: IC.trash, act: deleteKey }
      ],
      view: [
        { label: "展开全部", icon: IC.plus, act: function () {
            (function walk(p, node) { OPEN[P(p)] = true; Object.keys(node.k || {}).forEach(function (c) { walk(p.concat([c]), node.k[c]); }); })([], { k: REG, v: [] });
            renderAll();
          } },
        { label: "折叠全部", icon: IC.monitor, act: function () { Object.keys(OPEN).forEach(function (k) { delete OPEN[k]; }); renderAll(); } },
        { sep: true },
        { label: "刷新", icon: IC.refresh, act: function () { renderAll(); toast("已刷新"); } }
      ],
      fav: [{ label: "添加到收藏夹", icon: IC.info, act: function () { toast("已添加：" + P(path)); } },
        { label: "删除收藏夹（模拟）", icon: IC.trash, act: function () { toast("收藏夹已清空"); } }],
      help: [{ label: "关于注册表编辑器", icon: IC.info, act: function () {
          openWindow({ title: "关于注册表编辑器", icon: IC.regedit, w: 520, h: 340,
            html: '<div style="padding:20px;font-size:13px;line-height:2;color:#333">' +
              "注册表编辑器（模拟）<br>版本 1.0.0<br><br>" +
              "· 数据是一棵真实的可读写树，增删改后会写入浏览器 localStorage<br>" +
              "· 支持项与数值的 新建 / 重命名 / 删除 / 修改<br>" +
              "· 支持导出与导入标准 .reg 文本文件<br>" +
              "· HKEY_CURRENT_USER\\Software\\Simulator\\Theme 下的 AccentColor、Wallpaper、NightMode 会真实改变模拟器外观</div>" });
        } }]
    };
    const k = b.dataset.rm;
    if (k === "find") { doFind(); return; }
    const items = map[k];
    if (items) showCtx(r.left + 4, r.bottom + 4, items);
  });

  regApply();
  renderAll();
  statEl.textContent = "就绪 · 共 5 个根项";
}
